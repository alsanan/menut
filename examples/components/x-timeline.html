<!--
  @component x-timeline
  @description Vertical timeline with expand/collapse. Slotted .item elements with <time>, <strong>, and body content. Expand/Collapse All buttons.
  @usage <x-timeline><div class="item"><time>2024</time><strong>Title</strong>Body</div></x-timeline>
  @impl Script reads slotted items, builds <details>/<summary> with animated height transitions. Slotchange for reactivity.
-->
<template shadowrootmode="open">
<style>

:host{
    display:block;
    max-width:36em;
    margin:auto;
    font:400 var(--fs-body,16px)/1.4 inherit;
}

.btn-group{
    display:flex;
    gap:.375em;
    margin-bottom:1.5em;
}

.btn-group button{

    appearance:none;
    border:0;
    cursor:pointer;
    font:inherit;

    padding:.375em .75em;

    border-radius:.25em;

    background:var(--fg,oklch(.15 .01 90));
    color:var(--bg-card,#fff);

    transition:background-color .15s;

}

.btn-group button:hover{

    background:var(--fg-muted,oklch(.55 .02 90));

}

.timeline{

    position:relative;

    padding-inline-start:1.5em;
    padding-top:2em;

}

.timeline::before{

    content:"";

    position:absolute;

    top:0;
    bottom:0;

    inset-inline-start:.625em;

    width:.125em;

    background:currentColor;

    opacity:.2;

}

.item{

    display:block;

    position:relative;

    padding-bottom:0.25em;

}

.item summary{

    display:flex;

    align-items:flex-start;

    cursor:pointer;

    list-style:none;

}

.item summary::-webkit-details-marker{

    display:none;

}

.item summary::marker{

    display:none;

}

.arrow{

    flex:none;

    display:flex;

    align-items:center;
    justify-content:center;

    margin-inline-end:.25em;

    border-radius:.25em;

    transition:background .15s;

}

summary:hover .arrow{

    background:oklch(.55 .02 90 /.35);

}

.arrow svg{

    width:1.25em;
    height:1.25em;

    transform:rotate(-90deg);

    transition:transform .3s cubic-bezier(.65,0,.35,1);

}

details[open] .arrow svg{

    transform:rotate(0);

}

.dot{

    width:.75em;
    height:.75em;
    flex:none;
    border-radius:50%;
    background:var(--fg-muted);
    position:absolute;
    margin:.3em 0 0;
    margin-inline-start:-1.2em;

}

.meta{

    flex:1;

}

.meta time{

    display:block;

    font-size:.833em;

    line-height:2.4;

}

.meta strong{

    display:block;

    font-size:1.5em;

    line-height:1.333;

}

/* -------- cuerpo -------- */

.body{

    overflow:hidden;
    height:0;
    margin-inline-start: 1.5em;
}

.body-inner{

    padding:.5em .75em;

    background:oklch(.97 .005 90);

    opacity:0;

    transition:opacity .2s;

}

details[open] .body-inner{

    opacity:1;

}

</style>

<div class="btn-group">

    <button data-action="expand">
        Expand All
    </button>

    <button data-action="collapse">
        Collapse All
    </button>

</div>

<div class="timeline"></div>

<slot hidden></slot>


<script>
const host = this;
const root = host.el.shadowRoot;

const timeline = root.querySelector(".timeline");
const slot = root.querySelector("slot");

const SVG = `
<svg viewBox="0 0 24 24">
    <polyline
        points="7 10,12 15,17 10"
        fill="none"
        stroke="currentColor"
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
    />
</svg>
`;

function sourceItems(){

    return slot
        .assignedElements()
        .filter(el=>el.classList.contains("item"));

}

function clearTimeline(){

    timeline.replaceChildren();

}

function createItem(source){

    const details=document.createElement("details");
    details.className="item";

    const summary=document.createElement("summary");

    const arrow=document.createElement("span");
    arrow.className="arrow";
    arrow.innerHTML=SVG;

    const dot=document.createElement("span");
    dot.className="dot";

    const meta=document.createElement("span");
    meta.className="meta";

    const time=source.querySelector("time");
    const title=source.querySelector("strong,h1,h2,h3,h4,h5,h6");

    if(time)
        meta.append(time.cloneNode(true));

    if(title)
        meta.append(title.cloneNode(true));

    summary.append(
        dot,
        arrow,
        meta
    );

    const body=document.createElement("div");
    body.className="body";

    const inner=document.createElement("div");
    inner.className="body-inner";

    [...source.childNodes].forEach(node=>{

        if(node===time) return;
        if(node===title) return;

        inner.append(node.cloneNode(true));

    });

    body.append(inner);

    details.append(
        summary,
        body
    );

    summary.addEventListener("click",e=>{

        e.preventDefault();

        toggle(details);

    });

    return details;

}

function open(details){

    if(details.open)
        return;

    const body=details.querySelector(".body");
    const inner=details.querySelector(".body-inner");

    details.open=true;

    body.style.height="0px";

    const end=inner.scrollHeight;

    const animation=body.animate(
        [
            {height:"0px"},
            {height:end+"px"}
        ],
        {
            duration:300,
            easing:"cubic-bezier(.65,0,.35,1)",
            fill:"forwards"
        }
    );

    animation.onfinish=()=>{

        body.style.height="auto";

    };

}

function close(details){

    if(!details.open)
        return;

    const body=details.querySelector(".body");

    const start=body.offsetHeight;

    body.style.height=start+"px";

    const animation=body.animate(
        [
            {height:start+"px"},
            {height:"0px"}
        ],
        {
            duration:300,
            easing:"cubic-bezier(.65,0,.35,1)",
            fill:"forwards"
        }
    );

    animation.onfinish=()=>{

        body.style.height="0px";
        details.open=false;

    };

}

function toggle(details){

    if(details.open)
        close(details);
    else
        open(details);

}

function render(){

    clearTimeline();

    sourceItems().forEach(source=>{

        timeline.append(
            createItem(source)
        );

    });

}


/* ----------------------------------------------------------
   Expand / Collapse All
---------------------------------------------------------- */

root.addEventListener("click", e => {

    const action = e.target.dataset.action;

    if (!action)
        return;

    const openAll = action === "expand";

    timeline
        .querySelectorAll("details.item")
        .forEach(item => {

            if (openAll)
                open(item);
            else
                close(item);

        });

});

/* ----------------------------------------------------------
   Si cambia el contenido del slot, reconstruimos la vista
---------------------------------------------------------- */

slot.addEventListener("slotchange", () => {

    render();

});

/* ----------------------------------------------------------
   Primera construcción
---------------------------------------------------------- */

render();
</script>
</template>
