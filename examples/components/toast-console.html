<!--
  @component toast-console
  @description Captures console.error/warn/info and shows them as <dialog toast>. Use during development — never miss a console message again.
  @usage <toast-console active level="error,warn"></toast-console>
  @attr active – enable interception (boolean)
  @attr level – comma-separated: error,warn,info (default "error,warn")
  @attr timeout – auto-dismiss ms (default 6000, 0 = persist until clicked)
-->
<template shadowrootmode="open">
<style>:host{display:none}</style>

<script>
var host = this
var levels=(host.el.getAttribute('level')||'error,warn').split(',').map(function(s){return s.trim()})
var timeout=parseInt(host.el.getAttribute('timeout'));if(isNaN(timeout))timeout=6000
var active=host.el.hasAttribute('active')
var originals={}
var colors={error:'var(--red,#e00)',warn:'var(--yellow,#e80)',info:'var(--blue,#08f)'}

function fmt(a){
  return Array.prototype.map.call(a,function(v){
    try{return typeof v==='object'?JSON.stringify(v,null,2):String(v)}
    catch(e){return String(v)}
  }).join(' ')
}

function show(msg,lvl){
  var d=document.createElement('dialog')
  d.setAttribute('toast','')
  d.style.position='fixed'
  d.style.borderInlineStart='4px solid '+(colors[lvl]||'var(--fg-muted)')
  d.textContent=msg
  d.addEventListener('click',function(){if(d.isConnected){d.close();d.remove()}})
  document.body.appendChild(d)
  d.show()
  if(timeout>0)setTimeout(function(){if(d.isConnected){d.close();d.remove()}},timeout)
}

function intercept(lvl){
  originals[lvl]=console[lvl]
  console[lvl]=function(){
    originals[lvl].apply(console,arguments)
    if(active)show(fmt(arguments),lvl)
  }
}

levels.forEach(intercept)

host.setActive=function(v){active=v!==false}
host.destroy=function(){
  levels.forEach(function(l){if(originals[l])console[l]=originals[l]})
}
</script>
</template>
