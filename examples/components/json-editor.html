<!--
  @component json-editor
  @description Visual JSON editor with Tree and Raw views, powered by the @visual-json/core headless engine (vendored inline — no network). Edit values, add/remove/duplicate nodes, change types, undo/redo.
  @usage <json-editor value='{"title":"Weblin","version":1}'></json-editor>
  @impl Bundles the @visual-json/core engine inline (self-contained, offline). Tree edits go through immutable core ops, each committed to a History for undo/redo. Raw view parses JSON back into the same TreeState. Emits a `change` event and stays form-associated.
-->

<style>
:host {

  font-family: inherit;

  color: var(--fg, oklch(0.15 0.01 90));

  --je-border: var(--border, oklch(0.85 0.01 90));

}
* { box-sizing: border-box; }
.toolbar {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.5rem;
  border: 1px solid var(--je-border);
  border-bottom: none;
  border-radius: var(--je-radius) var(--je-radius) 0 0;
  background: var(--je-bg);
  flex-wrap: wrap;
}
.seg { display: flex; border: 1px solid var(--je-border); border-radius: var(--je-radius); overflow: hidden; }
.seg button {
  border: none; background: transparent; color: var(--je-fg-muted);
  padding: 0.3rem 0.7rem; font: inherit; font-size: 0.8rem; cursor: pointer;
}
.seg button[on] { background: var(--je-accent); color: var(--bg, oklch(1 0 0)); }
.tbtn {
  border: 1px solid var(--je-border); background: transparent; color: var(--je-fg-muted);

}
.tbtn:disabled { opacity: 0.4; cursor: default; }
.tbtn:hover:not(:disabled) { color: var(--je-accent); border-color: var(--je-accent); }
.spacer { flex: 1; }
.view {
  border: 1px solid var(--je-border); border-top: none;
  border-radius: 0 0 var(--je-radius) var(--je-radius);

}
#tree { padding: 0.35rem 0; }

.indent { flex: 0 0 auto; width: calc(var(--depth, 0) * 1rem); }

.key input {

}
.key input:hover { border-color: var(--je-border); }
.key input:focus {
  outline: none; border-color: var(--je-accent);

}
.badge {

}
.badge.object, .badge.array { color: var(--je-accent); border-color: var(--je-accent); }
.type { position: relative; display: inline-flex; align-items: center; }
.type::after {
  content: '\25BE';
  position: absolute; right: 0.1rem; top: 50%; transform: translateY(-50%);
  font-size: 0.5rem; line-height: 1; pointer-events: none;
  color: var(--je-fg-muted); opacity: 0.7;
}
select.badge {
  appearance: none; -webkit-appearance: none; cursor: pointer;
  border: 1px dashed var(--je-fg-muted);
  background: color-mix(in oklab, var(--je-fg-muted) 6%, transparent);
  color: var(--je-fg-muted);
  font: inherit; font-size: 0.62rem;
  text-transform: uppercase; letter-spacing: 0.03em;
  padding: 0.06rem 0.75rem 0.06rem 0.4rem;
  border-radius: 999px;
  transition: border-color .12s, background .12s, color .12s;
}
select.badge:hover, select.badge:focus {
  outline: none;
  border-style: solid; border-color: var(--je-accent);
  background: color-mix(in oklab, var(--je-accent) 15%, transparent);
  color: var(--je-accent);
}
.val { flex: 1 1 auto; }
.val input, .val select {
  width: 100%; font: inherit; font-size: inherit;
  border: 1px solid transparent; border-radius: 0.3rem;
  padding: 0.1rem 0.3rem; background: transparent; color: inherit;
}
.val input:hover, .val select:hover { border-color: var(--je-border); }
.val input:focus, .val select:focus { outline: none; border-color: var(--je-accent); background: var(--bg, oklch(1 0 0)); }
.val .lit { color: var(--je-fg-muted); }
.act { flex: 0 0 auto; display: flex; gap: 0.15rem; opacity: 0.35; transition: opacity .12s; }
.row:hover .act, .act:focus-within { opacity: 1; }
.act button {
  border: 1px solid var(--je-border);
  background: color-mix(in oklab, var(--je-fg-muted) 6%, transparent);
  cursor: pointer; padding: 0.1rem 0.3rem;
  color: var(--je-fg-muted); font: inherit; font-size: 0.75rem; border-radius: 0.3rem;
  transition: border-color .12s, color .12s, background .12s;
}
.act button:hover { border-color: var(--je-accent); color: var(--je-accent); background: color-mix(in oklab, var(--je-accent) 12%, transparent); }
.act button.del:hover { border-color: var(--danger, oklch(0.55 0.2 25)); color: var(--danger, oklch(0.55 0.2 25)); background: color-mix(in oklab, var(--danger, oklch(0.55 0.2 25)) 12%, transparent); }
#raw {
  width: 100%; border: none; resize: vertical; padding: 0.6rem;
  font-family: var(--mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace);

}

.fallback { padding: 1rem; color: var(--je-fg-muted); }
.err {
  color: var(--danger, oklch(0.55 0.2 25));
  font-size: 0.78rem; padding: 0.3rem 0.5rem; min-height: 1.2em;
}
</style>

const host = this

function setErr(msg) { errEl.textContent = msg || '' }
function setSeg(m) {
  mode = m
  btnTree.toggleAttribute('on', m === 'tree')
  btnRaw.toggleAttribute('on', m === 'raw')
  treeEl.hidden = m !== 'tree'
  rawEl.hidden = m !== 'raw'
}
function syncButtons() {
  undoBtn.disabled = !history || !history.canUndo || readonly
  redoBtn.disabled = !history || !history.canRedo || readonly

  host.el.dispatchEvent(new CustomEvent('change', { bubbles: true, composed: false, detail: { value } }))

function init() {
  state = core.fromJson(host.value)
  history = new core.History()
  history.push(state)
  open = new Set([state.root.id])
  renderAll()

  renderTree()
  syncButtons()
}

function renderTree() {
  treeEl.innerHTML = ''
  const frag = document.createDocumentFragment()
  walk(state.root, 0, frag)
  treeEl.appendChild(frag)
}

function walk(node, depth, parent) {
  const row = document.createElement('div')
  row.className = 'row'
  row.style.setProperty('--depth', depth)
  const ind = document.createElement('span')
  ind.className = 'indent'
  row.appendChild(ind)
  const isContainer = node.type === 'object' || node.type === 'array'
  const exp = document.createElement('span')
  exp.className = 'exp'
  if (isContainer) {
    exp.textContent = open.has(node.id) ? '\u25BE' : '\u25B8'
    exp.addEventListener('click', () => {
      if (open.has(node.id)) open.delete(node.id); else open.add(node.id)
      renderTree()
    })
  }
  row.appendChild(exp)
  row.appendChild(readonly ? makeBadge(node) : makeTypeSelect(node))
  row.appendChild(makeKey(node))
  row.appendChild(makeValueEditor(node))
  if (!readonly) row.appendChild(makeActions(node))
  parent.appendChild(row)
  if (isContainer && open.has(node.id)) {
    for (const c of node.children) walk(c, depth + 1, parent)
  }

function makeKey(node) {
  const isObjectKey = node.parentId && state.nodesById.get(node.parentId)?.type === 'object'
  const span = document.createElement('span')
  span.className = 'key'
  if (!readonly && isObjectKey) {
    const input = document.createElement('input')
    input.className = 'key-input'
    input.value = node.key
    input.setAttribute('aria-label', 'Property name')
    const commit = () => {
      const v = input.value.trim()
      if (v === node.key) { input.value = node.key; return }
      if (!v) { input.value = node.key; return }
      mutate(s => core.setKey(s, node.id, v))
    }
    input.addEventListener('change', commit)
    input.addEventListener('keydown', e => {

      if (e.key === 'Escape') { input.value = node.key; input.blur() }
    })
    span.appendChild(input)
    return span
  }
  span.textContent = node.key === '' ? '/' : node.key
  span.title = node.path
  return span
}

function makeBadge(node) {
  const badge = document.createElement('span')
  badge.className = 'badge ' + node.type
  badge.textContent = TYPE_ICONS[node.type]
  badge.title = node.type
  return badge
}

function makeTypeSelect(node) {
  const wrap = document.createElement('span')
  wrap.className = 'type'
  const sel = document.createElement('select')
  sel.className = 'badge ' + node.type
  ;['string', 'number', 'boolean', 'null', 'object', 'array'].forEach(t => {
    const o = document.createElement('option'); o.value = t; o.textContent = TYPE_ICONS[t]; o.title = t; sel.appendChild(o)
  })
  sel.value = node.type
  sel.title = 'Change type: ' + node.type
  sel.setAttribute('aria-label', 'Type: ' + node.type)
  sel.addEventListener('change', () => {
    const t = sel.value
    if (t === node.type) return
    mutate(s => {
      let s2 = core.changeType(s, node.id, t)
      if (t !== 'object' && t !== 'array') {
        const def = t === 'number' ? 0 : t === 'boolean' ? true : t === 'null' ? null : ''
        s2 = core.setValue(s2, node.id, def)
      }
      return s2
    })
  })
  wrap.appendChild(sel)
  return wrap
}

function makeValueEditor(node) {
  const wrap = document.createElement('div')
  wrap.className = 'val'
  const isContainer = node.type === 'object' || node.type === 'array'
  if (readonly || isContainer) {
    const span = document.createElement('span')
    span.className = 'lit'
    span.textContent = isContainer ? (node.type === 'object' ? '{ ' + node.children.length + ' }' : '[ ' + node.children.length + ' ]') : ''
    wrap.appendChild(span)
    return wrap
  }
  if (node.type === 'null') {
    const span = document.createElement('span')
    span.className = 'lit'
    span.textContent = 'null'
    wrap.appendChild(span)
    return wrap
  }
  if (node.type === 'boolean') {
    const sel = document.createElement('select')
    sel.value = String(node.value)
    ;['true', 'false'].forEach(v => {
      const o = document.createElement('option'); o.value = v; o.textContent = v; sel.appendChild(o)
    })
    sel.addEventListener('change', () => mutate(s => core.setValue(s, node.id, sel.value === 'true')))
    wrap.appendChild(sel)
    return wrap
  }
  const input = document.createElement('input')
  input.value = node.value == null ? '' : String(node.value)
  input.type = node.type === 'number' ? 'number' : 'text'
  if (node.type === 'number') input.step = 'any'
  const commitVal = () => {
    let v = input.value
    if (node.type === 'number') { v = v === '' ? 0 : Number(v); if (Number.isNaN(v)) return }

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') input.blur()
    if (e.key === 'Escape') { input.value = String(node.value); input.blur() }
  })
  wrap.appendChild(input)
  return wrap
}

function makeActions(node) {
  const wrap = document.createElement('div')
  wrap.className = 'act'
  const isContainer = node.type === 'object' || node.type === 'array'
  if (isContainer) {
    const add = document.createElement('button'); add.type = 'button'; add.title = 'Add child'; add.textContent = '+'
    add.addEventListener('click', () => addChild(node))
    wrap.appendChild(add)
  }
  if (node.parentId) {
    const dup = document.createElement('button'); dup.type = 'button'; dup.title = 'Duplicate'; dup.textContent = '\u2385'
    dup.addEventListener('click', () => mutate(s => core.duplicateNode(s, node.id)))

  const n = node.children.length
  const key = node.type === 'array' ? String(n) : 'key' + n

  if (readonly) return
  const next = fn(state)
  if (next === state) return
  state = next
  history.push(next)
  renderAll()
  commit()

rawEl.addEventListener('input', () => {
  rawEl.classList.remove('invalid')
  const text = rawEl.value.trim()
  if (!text) { setErr(''); return }
  let parsed
  try { parsed = JSON.parse(text) } catch (e) { rawEl.classList.add('invalid'); setErr('Invalid JSON: ' + e.message); return }

  state = core.fromJson(parsed)
  history.push(state)
  commit()

  if (!history || !history.canUndo) return
  state = history.undo()
  renderAll(); commit()

  if (!history || !history.canRedo) return
  state = history.redo()
  renderAll(); commit()

  try { await navigator.clipboard.writeText(JSON.stringify(core.toJson(state.root), null, 2)) } catch {}

  open = new Set([state.root.id])

  setSeg('raw')
  if (core) rawEl.value = JSON.stringify(core.toJson(state.root), null, 2)

  state = core.fromJson(host.value)
  history.push(state)

</script>
