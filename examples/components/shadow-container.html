<!--
  @component shadow-container
  @description Scrollable container with edge fade overlays (top/bottom or left/right). Attributes: horizontal for x-scroll.
  @usage <shadow-container>Content</shadow-container>
  @impl Wrapper + scroll container + absolute overlay divs with gradient masks. Scroll event + ResizeObserver opacity fade (30px distance).
-->
<template shadowrootmode="open">
<style>
:host{
  display:flex;
  flex-direction:column;
  min-height:0;
}

:host([hidden]){
  display:none;
}

:host([horizontal]){
  flex-direction:row;
}

.wrapper{
  position:relative;
  flex:1;
  min-width:0;
  min-height:0;
  display:flex;
  flex-direction:column;
}

:host([horizontal]) .wrapper{
  flex-direction:row;
}

.container{
  flex:1;
  min-width:0;
  min-height:0;
  overflow-y:auto;
  scrollbar-width:thin;
}

:host([horizontal]) .container{
  display:flex;
  overflow-x:auto;
  overflow-y:hidden;
}

/* ---------- overlays ---------- */

.overlay{
  position:absolute;
  pointer-events:none;
  z-index:1;
}

/* vertical */

.top{
  top:0;
  inset-inline:0;
  height:1.1rem;
  border-top:1px solid var(--fg);
  background:
    linear-gradient(
      to bottom,
      color-mix(in srgb,var(--fg-muted) 25%,transparent),
      transparent
  );
  mask-image: linear-gradient( to right, transparent, black 10%, black 90%, transparent );
}

.bottom{
  bottom:0;
  inset-inline:0;
  height:1.1rem;
  border-bottom:1px solid var(--fg);
  background:
    linear-gradient(
      to top,
      color-mix(in srgb,var(--fg-muted) 25%,transparent),
      transparent
  );
  mask-image: linear-gradient( to right, transparent, black 10%, black 90%, transparent );
}

/* horizontal */

.left,
.right{
  display:none;
}

:host([horizontal]) .left{
  display:block;
  inset-inline-start:0;
  top:0;
  bottom:0;
  width:1.1rem;
  border-inline-start:1px solid var(--fg);
  background:linear-gradient(
      to right,
      color-mix(in srgb,var(--fg-muted) 25%,transparent),
      transparent
  );
  mask-image: linear-gradient( to bottom, transparent, black 10%, black 90%, transparent );
}

:host([horizontal]) .right{
  display:block;
  inset-inline-end:0;
  top:0;
  bottom:0;
  width:1.1rem;
  border-inline-end:1px solid var(--fg);
  background:linear-gradient(
      to left,
      color-mix(in srgb,var(--fg-muted) 25%,transparent),
      transparent
  );
  mask-image: linear-gradient( to bottom, transparent, black 10%, black 90%, transparent );
}

:host([horizontal]) .top,
:host([horizontal]) .bottom{
  display:none;
}
</style>

<div class="wrapper">

  <div class="container">
    <slot></slot>
  </div>

  <div class="overlay top"></div>
  <div class="overlay bottom"></div>
  <div class="overlay left"></div>
  <div class="overlay right"></div>

</div>


<script>
const root=this.el.shadowRoot;

const c=root.querySelector('.container');

const top=root.querySelector('.top');
const bottom=root.querySelector('.bottom');
const left=root.querySelector('.left');
const right=root.querySelector('.right');

const slot=root.querySelector('slot');

function update(){
  const fadeDist=30
  if(root.host.hasAttribute('horizontal')){
    const max=Math.max(0,c.scrollWidth-c.clientWidth);
    left.style.opacity=Math.min(1,c.scrollLeft/fadeDist);
    right.style.opacity=max?Math.min(1,(max-c.scrollLeft)/fadeDist):0;
  }else{
    const max=Math.max(0,c.scrollHeight-c.clientHeight);
    top.style.opacity=Math.min(1,c.scrollTop/fadeDist);
    bottom.style.opacity=max?Math.min(1,(max-c.scrollTop)/fadeDist):0;
  }
}

c.addEventListener('scroll',update,{passive:true});
const ro=new ResizeObserver(update)
ro.observe(c);
slot?.addEventListener('slotchange',()=>{
  for(const el of slot.assignedElements()) ro.observe(el);
  requestAnimationFrame(update);
});

requestAnimationFrame(()=>{
  requestAnimationFrame(update);
});
</script>
</template>
