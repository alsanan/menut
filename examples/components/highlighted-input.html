<!--
  @component highlighted-input
  @description Text input with real-time keyword highlighting. Keywords specified as comma-separated list in the words attribute get highlighted as the user types.
  @usage <highlighted-input words="lang:,repo:,user:,AND,OR,NOT" placeholder="Search..."></highlighted-input>
  @impl Uses a contenteditable element and the CSS Custom Highlight API (::highlight()) applied DIRECTLY on it — no underlay layer, so the highlight rectangles are inherently aligned with the text (no positioning that can drift). Each instance gets a unique highlight name. Falls back gracefully when the API is unavailable.
-->
<template shadowrootmode="open">
<style>
:host {
  display: block;
}
.editor {
  box-sizing: border-box;
  font: inherit;
  font-size: var(--fs-sm, 0.9rem);
  font-weight: 400;
  width: 100%;
  padding: 0.625rem 0.75rem;
  border: var(--border, 1px solid oklch(0.85 0.01 90));
  border-radius: var(--radius, 0.5rem);
  background-color: var(--bg-card, oklch(0.97 0.005 90));
  color: var(--fg, oklch(0.15 0.01 90));
  line-height: 1.5;
  white-space: pre;
  overflow-x: auto;
  cursor: text;
  transition: border-color 0.18s ease, box-shadow 0.18s ease;
}
.editor:focus {
  outline: none;
  border-color: var(--border-focus, oklch(0.55 0.15 145));
}
.editor:empty::before {
  content: attr(data-placeholder);
  color: var(--fg-muted, oklch(0.6 0.01 90));
  pointer-events: none;
}
</style>
<div class="editor" contenteditable="true" role="textbox" aria-multiline="false" spellcheck="false"></div>

<script>
const host = this
const root = host.el.shadowRoot
const editor = root.querySelector('.editor')

if (host.el.hasAttribute('placeholder')) editor.dataset.placeholder = host.el.getAttribute('placeholder')
if (host.el.hasAttribute('value')) editor.textContent = host.el.getAttribute('value')

const uid = 'hi-' + ((window.__hiUid = (window.__hiUid || 0) + 1))
const styleEl = document.createElement('style')
styleEl.textContent = `.editor::highlight(${uid}) {
  background-color: var(--accent-bg, oklch(0.85 0.08 145 / 0.4));
  border-radius: 2px;
  padding: 0 1px;
}`
root.insertBefore(styleEl, root.firstChild)

const hasHighlightAPI = typeof CSS !== 'undefined' && CSS.highlights

function render() {
  // Pega / Enter pueden crear varios hijos: colapsar a un único nodo de texto
  // para que los Range apunten al texto visible.
  if (editor.childNodes.length > 1) editor.textContent = editor.textContent

  const text = editor.textContent || ''
  const words = (host.el.getAttribute('words') || '').split(',').map(w => w.trim()).filter(Boolean)
  if (!(hasHighlightAPI && words.length && text)) {
    if (hasHighlightAPI && CSS.highlights.get(uid)) CSS.highlights.delete(uid)
    return
  }

  const ranges = []
  const lower = text.toLowerCase()
  words.forEach(word => {
    const lowerWord = word.toLowerCase()
    let idx = 0
    while ((idx = lower.indexOf(lowerWord, idx)) !== -1) {
      const range = new Range()
      range.setStart(editor.firstChild, idx)
      range.setEnd(editor.firstChild, idx + word.length)
      ranges.push(range)
      idx += word.length
    }
  })

  if (ranges.length) CSS.highlights.set(uid, new Highlight(...ranges))
  else if (CSS.highlights.get(uid)) CSS.highlights.delete(uid)
}

editor.addEventListener('input', () => {
  render()
  host.el.setAttribute('value', editor.textContent)
})
editor.addEventListener('keydown', e => {
  if (e.key === 'Enter') e.preventDefault()   // contenido de una sola línea
})
render()
</script>
</template>
