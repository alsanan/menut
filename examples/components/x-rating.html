<!--
  @component x-rating
  @description Star rating as a masked range input. CSS-only star shapes via conic-gradient masks. Half-star support, keyboard-native, form-associated.
  @usage <x-rating value="2.5" step="0.5"></x-rating>
  @impl Native <input type="range"> with CSS conic-gradient mask creating 5 star shapes. Background linear-gradient fills stars based on --val. Range handles value, keyboard, and form participation natively. No JS for visuals. Typed props value/max/step + onpropchange react to attribute changes.
-->
<template shadowrootmode="open" value:number="0" max:number="5" step:number="1">
<style>
  :host {
    display: inline-block;
    line-height: 0;
  }
  input {
    --size: 1.8em;
    --mask:
      conic-gradient(from -18deg at 61% 34.5%, #0000 108deg, #000 0) 0 / var(--size),
      conic-gradient(from 270deg at 39% 34.5%, #0000 108deg, #000 0) 0 / var(--size),
      conic-gradient(from 54deg at 68% 56%, #0000 108deg, #000 0) 0 / var(--size),
      conic-gradient(from 198deg at 32% 56%, #0000 108deg, #000 0) 0 / var(--size),
      conic-gradient(from 126deg at 50% 69%, #0000 108deg, #000 0) 0 / var(--size);
    --bg: linear-gradient(90deg, var(--accent, oklch(0.75 0.15 85)) calc(var(--size) * var(--val)), var(--hairline, oklch(0.9 0.01 90)) 0);
    height: var(--size);
    width: calc(var(--size) * 5);
    border: 0;
    -webkit-appearance: none;
    appearance: none;
    cursor: pointer;
    display: block;
  }
  input::-webkit-slider-runnable-track {
    height: 100%;
    -webkit-mask: var(--mask);
    -webkit-mask-composite: intersect;
    mask: var(--mask);
    mask-composite: intersect;
    background: var(--bg);
  }
  input::-webkit-slider-thumb { opacity: 0; }
  input::-moz-range-track {
    height: 100%;
    mask: var(--mask);
    mask-composite: intersect;
    background: var(--bg);
  }
  input::-moz-range-thumb { opacity: 0; }
</style>
<input type="range" part="input" tabindex="0">

<script>
const host = this
  const root = host.el.shadowRoot
  const input = root.querySelector('input')
  const clamp = v => Math.max(0.5, v)
  input.max = clamp(host.max)
  input.step = clamp(host.step)
  input.value = Math.min(Math.max(host.value, 0), host.max)
  input.style.setProperty('--val', input.value)
  function emit() {
    host.el._internals.setFormValue(input.value)
    host.el.dispatchEvent(new CustomEvent('change', { detail: { value: parseFloat(input.value) } }))
  }
  input.addEventListener('input', () => input.style.setProperty('--val', input.value))
  input.addEventListener('change', emit)
  host.onpropchange = (name) => {
    if (name === 'max') input.max = clamp(host.max)
    else if (name === 'step') input.step = clamp(host.step)
    else if (name === 'value') {
      input.value = Math.min(Math.max(host.value, 0), host.max)
      input.style.setProperty('--val', input.value)
      emit()
    }
  }
</script>
</template>
