<!--
  @component x-code-block
  @description Code block with syntax coloring via color font. Header shows language name and Copy button. Attribute: lang.
  @usage <x-code-block lang="js">code here</x-code-block>
  @impl Uses FontWithASyntaxHighlighter color font via @font-palette-values. Copy button uses clipboard API. Pre with scroll.
-->
<template shadowrootmode="open">
  <style>
    @font-face {
      font-family: 'FontWithASyntaxHighlighter';
      src: url('https://weblin.org/FontWithASyntaxHighlighter-Regular.woff2') format('woff2');
    }
    @font-palette-values --code-palette {
      font-family: 'FontWithASyntaxHighlighter';
      override-colors:
        0 oklch(0.7 0.2 290),    /* keywords, {} */
        1 oklch(0.55 0.02 260),  /* comments */
        2 oklch(0.65 0.18 160),  /* literals/strings */
        3 oklch(0.7 0.18 80),    /* numbers */
        4 oklch(0.65 0.18 250),  /* functions, [] */
        5 oklch(0.7 0.15 30),    /* JS others */
        6 oklch(0.13 0.17 30),   /* not in use */
        7 oklch(0.75 0.18 150),  /* inside quotes, CSS props */
        8 oklch(0.6 0.18 120)    /* few chars */
      ;
    }
    :host {
      display: block;
      position: relative;
      border-radius: var(--radius-card, 16px);
      background: oklch(0.05 0.02 90);
      color: oklch(0.98 0 0);
      overflow: hidden;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-2, 8px) var(--space-3, 16px);
      background: oklch(0.1 0.01 260);
      border-bottom: 1px solid oklch(0.25 0.01 260);
    }
    .lang {
      font: 500 var(--fs-xs, 12px)/1 inherit;
      color: oklch(0.6 0.01 260);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .copy {
      appearance: none;
      border: 1px solid oklch(0.25 0.01 260);
      background: transparent;
      padding: var(--space-1, 4px) var(--space-2, 8px);
      border-radius: calc(var(--radius-card, 16px) - 4px);
      font: 400 var(--fs-xs, 12px)/1 inherit;
      color: oklch(0.6 0.01 260);
      cursor: pointer;
      transition: background-color 0.18s ease, color 0.18s ease;
    }
    .copy:hover { background: oklch(0.2 0.01 260); color: oklch(0.8 0 0); }
    pre {
      margin: 0;
      padding: var(--space-4, 24px);
      overflow-x: auto;
      overflow-y: auto;
      max-height: 24rem;
      scrollbar-width: thin;
      scrollbar-color: oklch(0.3 0.01 260) transparent;
    }
    code {
      font: 400 1em/1.6 'FontWithASyntaxHighlighter', monospace;
      font-palette: --code-palette;
      tab-size: 2;
    }
  </style>
  <div class="header">
    <span class="lang"></span>
    <button class="copy">Copy</button>
  </div>
  <pre><code><slot></slot></code></pre>

<script>
const root = this.el.shadowRoot
  const host = this
  const lang = root.querySelector('.lang')
  lang.textContent = host.el.getAttribute('lang') || 'code'
  root.querySelector('.copy').addEventListener('click', () => {
    const code = host.el.textContent
    navigator.clipboard.writeText(code).then(() => {
      root.querySelector('.copy').textContent = 'Copied!'
      setTimeout(() => root.querySelector('.copy').textContent = 'Copy', 1500)
    })
  })

if (!window.__fontWASH_loaded) {
  window.__fontWASH_loaded = true
  const fontUrl = new URL('https://weblin.org/FontWithASyntaxHighlighter-Regular.woff2', location.href).href
  const font = new FontFace('FontWithASyntaxHighlighter', `url(${fontUrl}) format('woff2')`)
  document.fonts.add(font)
  font.load().catch(err => console.warn('Error carregant font:', err))
}
</script>
</template>
