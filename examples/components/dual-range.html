<!--
  @component dual-range
  @description Dual-handle range slider. Attributes: min, max, step, low, high. Form-associated, emits low/high JSON.
  @usage <dual-range min="0" max="100" low="25" high="75"></dual-range>
  @impl Two overlay range inputs, fill bar between thumbs. Script prevents crossover, updates labels and setFormValue.
-->
<template shadowrootmode="open">
  <style>
    :host {
      display: block;
      padding: 1.5rem 0;
      position: relative;
    }

    .slider {
      position: relative;
      height: 28px;
    }

    .track {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: 8px;
      transform: translateY(-50%);
      border-radius: 999px;
      background: var(--hairline, oklch(0.9 0.01 90));
      overflow: hidden;
    }

    .fill {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 25%;
      right: 25%;
      border-radius: inherit;
      background: var(--fg, oklch(0.15 0.01 90));
    }

    input[type="range"] {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 28px;

      margin: 0;
      padding: 0;

      background: none;
      appearance: none;
      -webkit-appearance: none;

      pointer-events: none;
      outline: none;
    }

    input[type="range"]::-webkit-slider-runnable-track {
      height: 28px;
      background: transparent;
    }

    input[type="range"]::-moz-range-track {
      height: 28px;
      background: transparent;
      border: none;
    }
        /* ---------- Thumb (Chromium / Safari) ---------- */

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;

      width: 28px;
      height: 28px;

      border: none;
      border-radius: 50%;

      background: var(--bg-card, #fff);

      box-shadow:
        0 2px 6px rgb(0 0 0 /.18);

      cursor: col-resize;

      pointer-events: auto;

      position: relative;
      z-index: 3;
    }

    /* ---------- Thumb (Firefox) ---------- */

    input[type="range"]::-moz-range-thumb {

      width: 28px;
      height: 28px;

      border: none;
      border-radius: 50%;

      background: var(--bg-card, #fff);

      box-shadow:
        0 2px 6px rgb(0 0 0 /.18);

      cursor: col-resize;

      pointer-events: auto;
    }

    /* ---------- Los dos range ocupan el mismo sitio ---------- */

    .low {
      z-index: 2;
    }

    .high {
      z-index: 3;
    }

    /* Sólo el thumb recibe eventos */

    .low {
      pointer-events: none;
    }

    .high {
      pointer-events: none;
    }

    .low::-webkit-slider-thumb {
      pointer-events: auto;
    }

    .high::-webkit-slider-thumb {
      pointer-events: auto;
    }

    .low::-moz-range-thumb {
      pointer-events: auto;
    }

    .high::-moz-range-thumb {
      pointer-events: auto;
    }

    /* ---------- Etiquetas ---------- */

    .value {

      position: absolute;

      top: -2rem;

      transform: translateX(-50%);

      font-size: .75rem;

      font-weight: 600;

      color: var(--fg, oklch(.15 .01 90));

      white-space: nowrap;

      user-select: none;

      pointer-events: none;

    }

  </style>

  <div class="slider">

    <div class="track">

      <div class="fill"></div>

    </div>

    <div class="value value-low"></div>
    <div class="value value-high"></div>

    <input class="low" type="range" aria-label="Minimum value">
    <input class="high" type="range" aria-label="Maximum value">

  </div>

<script>
const root = this.el.shadowRoot;
const host = this;

const low = root.querySelector(".low");
const high = root.querySelector(".high");

const fill = root.querySelector(".fill");

const labelLow = root.querySelector(".value-low");
const labelHigh = root.querySelector(".value-high");

const min  = Number(host.el.getAttribute("min")  ?? 0);
const max  = Number(host.el.getAttribute("max")  ?? 100);
const step = Number(host.el.getAttribute("step") ?? 1);

low.min = high.min = min;
low.max = high.max = max;
low.step = high.step = step;

low.value = host.el.getAttribute("low")  ?? min;
high.value = host.el.getAttribute("high") ?? max;

function percent(v){

    return ((v-min)/(max-min))*100;

}

function update(){

    let a = Number(low.value);
    let b = Number(high.value);

    /* impedir que se crucen */

    if(a>b){

        if(root.activeElement===low)
            high.value=a;
        else
            low.value=b;

        a=Number(low.value);
        b=Number(high.value);

    }

    const pa=percent(a);
    const pb=percent(b);

    fill.style.left=pa+"%";
    fill.style.right=(100-pb)+"%";

    labelLow.style.left=pa+"%";
    labelHigh.style.left=pb+"%";

    labelLow.textContent=a;
    labelHigh.textContent=b;

    /* thumb superior */

    if(pb-pa<4){

        low.style.zIndex=4;
        high.style.zIndex=3;

    }else{

        low.style.zIndex=2;
        high.style.zIndex=3;

    }

    host.el._internals.setFormValue(JSON.stringify({low:a,high:b}));
    host.el.dispatchEvent(new CustomEvent("input",{

        detail:{
            low:a,
            high:b
        }

    }));

}

low.addEventListener("input",update);
high.addEventListener("input",update);

low.addEventListener("change",update);
high.addEventListener("change",update);

update();
</script>
</template>
