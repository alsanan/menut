<!--
  @component text-rotator
  @description Typewriter text rotator. Attribute words (comma-separated) cycled with typing/deleting animation. Attributes: speed, hold, hide-cursor.
  @usage <text-rotator words="hello,world,foo"></text-rotator>
  @impl setTimeout-based character-by-character typing and deleting. Pop-in animation on new word. MutationObserver re-parses attributes.
-->
<template shadowrootmode="open">
<style>
:host{display:inline}
.wrapper{
  display:inline;
  font:inherit;
  position:relative;
}
#word{
  display:inline;
}
#word.pop{
  animation:pop-in .25s ease-out;
}
@keyframes pop-in{
  from{opacity:0;transform:translateY(.15em);filter:blur(4px)}
  to{opacity:1;transform:translateY(0);filter:blur(0)}
}
#cursor{
  display:inline-block;
  width:.6em;
  height:1.2em;
  background:currentColor;
  vertical-align:text-bottom;
  margin-inline-start:.05em;
  animation:blink .7s steps(2) infinite;
}
@keyframes blink{
  0%{opacity:1}
  50%{opacity:0}
}
:host([hide-cursor]) #cursor{display:none}
</style>
<span class="wrapper">
  <span id="word"></span>
  <span id="cursor"></span>
</span>

<script>
const host=this
const root=host.el.shadowRoot
const wordEl=root.getElementById('word')
let words=[]
let idx=0
let timer=null
let writing=false

function parse(){
  const a=host.el.getAttribute('words')
  words=a?a.split(',').map(w=>w.trim()).filter(Boolean):[]
  idx=0
  clearTimeout(timer)
  writing=false
  wordEl.textContent=''
  if(words.length)next()
}

function next(){
  if(!words.length)return
  const target=words[idx%words.length]
  typeWord(target,()=>{
    idx++
    timer=setTimeout(next,parseFloat(host.el.getAttribute('hold'))||2000)
  })
}

function typeWord(target,done){
  let i=0
  const ms=parseFloat(host.el.getAttribute('speed'))||60
  wordEl.classList.remove('pop')
  wordEl.offsetHeight
  wordEl.classList.add('pop')
  function type(){
    if(i<=target.length){
      wordEl.textContent=target.slice(0,i)
      i++
      timer=setTimeout(type,ms)
    }else{
      clearTimeout(timer)
      timer=setTimeout(()=>deleteWord(target,done),parseFloat(host.el.getAttribute('hold'))||2000)
    }
  }
  type()
}

function deleteWord(target,done){
  let i=target.length
  const ms=parseFloat(host.el.getAttribute('speed'))||60
  function del(){
    if(i>=0){
      wordEl.textContent=target.slice(0,i)
      i--
      timer=setTimeout(del,ms/2)
    }else{
      clearTimeout(timer)
      done()
    }
  }
  del()
}

const mo=new MutationObserver(parse)
mo.observe(host.el,{attributes:true,attributeFilter:['words','speed','hold']})
parse()
</script>
</template>
