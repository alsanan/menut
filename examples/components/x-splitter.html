<!--
  @component x-splitter
  @description Resizable split panel. Slots: start (left/top), end (right/bottom). CSS-only resize via native resize property. Attribute: vertical.
  @usage <x-splitter><div slot="start">Left</div><div slot="end">Right</div></x-splitter>
  @impl CSS-only. .panel.start uses resize:horizontal (or vertical). Grid tracks auto/gutter/1fr. Content overflow hidden with absolute inner div. Handle decoration.
-->
<template shadowrootmode="open">
<style>
:host{
  container-type:size;
  display:grid;
  grid-template-columns:auto /*var(--gutter,8px)*/ 1fr;
  min-height:0;
}
:host([hidden]){display:none}
:host([vertical]){
  grid-template-columns:none;
  grid-template-rows:auto var(--gutter,8px) 1fr;
}

.panel.start{
  resize:horizontal;
  overflow:hidden;
  position:relative;
  min-width:80px;
  max-width:calc(100cqi - 86px);
  min-height:0;
  border-right:2px dashed var(--hairline);
}
.panel.start:after{
  content: "🡘";
  font-weight:900;
  font-size:30px;
  transform: translate(3px, 3px);
  text-shadow: 0 0 3px var(--black);
  line-height:0.8;
  position:absolute;
  right:0;
  bottom:0;  
}
:host([vertical]) .panel.start{
  resize:vertical;
  min-width:0;
  min-height:80px;
  max-height:calc(100cqh - 86px);
  border-right-width:0;
  border-bottom:2px dashed var(--hairline);  
}

.panel.end{
  overflow:auto;
  min-width:0;
  min-height:0;
}

.content{position:absolute;inset:0;overflow:auto}

</style>
<div class="panel start">
  <div class="content"><slot name="start"></slot></div>
</div>
<!--div class="divider">
  <div class="handle"></div>
</div-->
<div class="panel end">
  <slot name="end"></slot>
</div>
</template>
