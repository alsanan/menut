<!--
  @component date-picker
  @description Styled wrapper around <input type="date">. Shows the selected date formatted and emits change events.
  @usage <date-picker value="2026-08-11" lang="en"></date-picker>
  @impl Native date input styled with CSS. The calendar popup is browser-native; the visible field and icon are customized.
-->
<template shadowrootmode="open" value:string="" lang:string="en" placeholder:string="Pick a date">
<style>
  :host { display: inline-block; }
  .wrap {
    position: relative;
    display: inline-flex;
    align-items: center;
    border: 1px solid var(--hairline, oklch(0.9 0.01 90));
    border-radius: var(--radius, 0.6rem);
    background: var(--bg-card, oklch(0.97 0.005 90));
    padding: 0 .75rem;
    gap: .5rem;
    min-height: 2.5rem;
    transition: border-color .15s;
  }
  .wrap:focus-within { border-color: var(--accent, oklch(0.55 0.15 145)); }
  input[type="date"] {
    appearance: none; -webkit-appearance: none;
    border: none; background: transparent; color: var(--fg, oklch(0.15 0.01 90));
    font: inherit; font-size: var(--fs-sm, 0.875rem);
    padding: .5rem 0; width: 9rem;
  }
  input[type="date"]::-webkit-calendar-picker-indicator {
    opacity: 0; width: 100%; position: absolute; inset: 0; cursor: pointer;
  }
  .icon {
    pointer-events: none;
    color: var(--fg-muted, oklch(0.55 0.02 90));
    display: flex; align-items: center;
  }
  .display {
    font-size: var(--fs-sm, 0.875rem);
    color: var(--fg-muted, oklch(0.55 0.02 90));
    min-width: 7rem;
  }
</style>
<div class="wrap" part="field">
  <span class="icon">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
  </span>
  <input type="date" part="input" aria-label="Date">
  <span class="display" part="display"></span>
</div>

<script>
const host = this
const root = host.el.shadowRoot
const input = root.querySelector('input')
const display = root.querySelector('.display')
function fmt(iso) {
  if (!iso) return host.placeholder || 'Pick a date'
  const d = new Date(iso + 'T00:00:00')
  if (Number.isNaN(d.getTime())) return iso
  return new Intl.DateTimeFormat(host.lang || 'en', { day: 'numeric', month: 'short', year: 'numeric' }).format(d)
}
function emit() {
  const v = input.value
  display.textContent = fmt(v)
  host.value = v
  host.el.dispatchEvent(new CustomEvent('change', { detail: { value: v } }))
}
input.value = host.value || ''
display.textContent = fmt(input.value)
input.addEventListener('change', emit)
input.addEventListener('input', emit)
host.onpropchange = (name) => {
  if (name === 'value' && input.value !== host.value) {
    input.value = host.value || ''
    display.textContent = fmt(input.value)
  }
  if (name === 'lang') display.textContent = fmt(input.value)
}
</script>
</template>
