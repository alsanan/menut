<!--
  @component x-export
  @description Button to export a JSON array/object as CSV or JSON file.
  @usage <x-export data='[{"a":1}]' format="csv" filename="data.csv"></x-export>
  @impl Client-side only: builds a Blob and triggers a download via an <a> element.
-->
<template shadowrootmode="open" data:object="[]" format:string="json" filename:string="export.json">
<style>
  :host { display: inline-block; }
  button {
    border: 1px solid var(--hairline, oklch(0.9 0.01 90));
    background: var(--bg-card, oklch(0.97 0.005 90));
    color: var(--fg, oklch(0.15 0.01 90));
    border-radius: var(--radius, 0.6rem);
    padding: 0.4rem 0.8rem;
    font: inherit;
    font-size: var(--fs-sm, 0.875rem);
    cursor: pointer;
    transition: border-color .15s, color .15s;
  }
  button:hover { border-color: var(--accent, oklch(0.55 0.15 145)); color: var(--accent, oklch(0.55 0.15 145)); }
</style>
<button type="button" part="button"></button>

<script>
const host = this
const btn = host.el.shadowRoot.querySelector('button')
function escapeCSV(v) {
  const s = v == null ? '' : String(v).replace(/"/g, '""')
  return /[",\n\r]/.test(s) ? '"' + s + '"' : s
}
function toCSV(data) {
  if (!Array.isArray(data) || data.length === 0) return ''
  const keys = Object.keys(data[0])
  const lines = [keys.map(escapeCSV).join(',')]
  for (const row of data) lines.push(keys.map(k => escapeCSV(row[k])).join(','))
  return lines.join('\n')
}
function updateLabel() {
  const fmt = (host.format || 'json').toLowerCase()
  btn.textContent = 'Export ' + fmt.toUpperCase()
}
function download() {
  const fmt = (host.format || 'json').toLowerCase()
  const data = host.data || []
  let blob, name
  if (fmt === 'csv') {
    blob = new Blob([toCSV(data)], { type: 'text/csv;charset=utf-8;' })
    name = host.filename || 'export.csv'
  } else {
    blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json;charset=utf-8;' })
    name = host.filename || 'export.json'
  }
  const url = URL.createObjectURL(blob)
  const a = document.createElement('a')
  a.href = url
  a.download = name
  document.body.appendChild(a)
  a.click()
  a.remove()
  URL.revokeObjectURL(url)
  host.el.dispatchEvent(new CustomEvent('export', { detail: { format: fmt, filename: name } }))
}
btn.addEventListener('click', download)
host.onpropchange = () => updateLabel()
updateLabel()
</script>
</template>
