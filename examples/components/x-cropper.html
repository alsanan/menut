<!--
  @component x-cropper
  @description Image cropper using cropperjs from CDN. Emits the cropped image as base64.
  @usage <x-cropper src="photo.jpg" aspect-ratio="1"></x-cropper>
  @impl Loads cropperjs CSS+JS. Provides Crop and Reset buttons. Emits change with base64 PNG.
-->
<template shadowrootmode="open" src:string="" aspect-ratio:string="NaN" value:string="">
<style>
  @import url('https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.css');
  :host { display: block; }
  .wrap {
    border: 1px solid var(--hairline, oklch(0.9 0.01 90));
    border-radius: var(--radius, 0.6rem);
    background: var(--bg-card, oklch(0.97 0.005 90));
    overflow: hidden;
  }
  img { display: block; max-width: 100%; max-height: 20rem; }
  .toolbar {
    display: flex; gap: .5rem; padding: .5rem; border-top: 1px solid var(--hairline, oklch(0.9 0.01 90));
  }
  button {
    border: 1px solid var(--hairline, oklch(0.9 0.01 90));
    background: var(--bg-card, oklch(0.97 0.005 90));
    color: var(--fg, oklch(0.15 0.01 90));
    border-radius: var(--radius, 0.6rem);
    padding: .3rem .7rem;
    font: inherit; font-size: var(--fs-sm, 0.875rem);
    cursor: pointer;
  }
  button:hover { border-color: var(--accent, oklch(0.55 0.15 145)); color: var(--accent, oklch(0.55 0.15 145)); }
</style>
<div class="wrap">
  <img id="img" part="image" src="" alt="Crop preview">
  <div class="toolbar" part="toolbar">
    <button type="button" class="crop" part="crop">Crop</button>
    <button type="button" class="reset" part="reset">Reset</button>
  </div>
</div>

<script>
const host = this
const root = host.el.shadowRoot
const img = root.querySelector('#img')
let cropper = null
function loadCropper() {
  if (window.Cropper) return Promise.resolve(window.Cropper)
  return new Promise(resolve => {
    if (document.querySelector('script[data-cropperjs]')) {
      const check = () => { if (window.Cropper) resolve(window.Cropper); else setTimeout(check, 30) }
      check()
      return
    }
    const s = document.createElement('script')
    s.src = 'https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.js'
    s.dataset.cropperjs = '1'
    s.onload = () => resolve(window.Cropper)
    document.head.appendChild(s)
  })
}
async function init(src) {
  if (!src) return
  const Cropper = await loadCropper()
  img.src = src
  await new Promise(r => { img.onload = r })
  if (cropper) cropper.destroy()
  const ratio = parseFloat(host.aspectRatio)
  cropper = new Cropper(img, {
    aspectRatio: Number.isNaN(ratio) ? NaN : ratio,
    viewMode: 1,
    autoCropArea: 0.8
  })
}
function emit(data) {
  host.value = data
  host.el.dispatchEvent(new CustomEvent('change', { detail: { value: data } }))
}
root.querySelector('.crop').addEventListener('click', () => {
  if (!cropper) return
  const canvas = cropper.getCroppedCanvas({ width: 400, height: 400 })
  emit(canvas.toDataURL('image/png'))
})
root.querySelector('.reset').addEventListener('click', () => {
  if (cropper) cropper.reset()
})
host.onpropchange = (name) => {
  if (name === 'src') init(host.src || '')
}
init(host.src || '')
</script>
</template>
