<!--
  @component hero-text
  @description Large hero heading with colored text-shadow and glow. CSS var: --hero-hue for hue control. Slotted <small> for subtitle.
  @usage <hero-text style="--hero-hue:320">Heading<small>Subtitle</small></hero-text>
  @impl CSS-only. Clamp font-size, oklch text-shadow with hue control, ::slotted for subtitle styling.
-->
<template shadowrootmode="open">
<style>
:host{display:block;}
.wrap{
    --text-hero:oklch(85% .1 var(--hue));
    --hue:var(--hero-hue,320);
    border-radius:var(--radius-card,16px);
    padding:var(--space-6,48px) var(--space-5,32px);
    background-color: var(--bg-muted);
}
h1{
    --shadow-hero:oklch(20% 0.1 var(--hue));
    --highlight-hero:oklch(98% .05 var(--hue));
    color:var(--bg-card);
    font-size:clamp(2.5rem,15vi,6rem);
    letter-spacing:-.15ch;
    line-height:.78;
    margin:0;
    text-shadow:
        0 .15ch 15px var(--shadow-hero),
        0 -2px 0 var(--highlight-hero);
    font-weight:900;
}
::slotted(small){
    display:block;
    max-inline-size:30ch;
    margin-top:var(--space-3,16px);
    opacity:.85;
    font-size:var(--fs-sm,14px);
}
</style>
<div class="wrap">
    <h1 part="heading"><slot></slot></h1>
</div>
</template>
