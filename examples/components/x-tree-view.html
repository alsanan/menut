<!--
  @component x-tree-view
  @description Tree/list view with nested <ul>/<li>/<details>. Removes list-style from nested <ul>.
  @usage <x-tree-view><ul><li><details><summary>Node</summary><ul>...</ul></details></li></ul></x-tree-view>
  @impl Script reads slotted elements, removes list-style from nested <ul> for cleaner display.
-->
<template shadowrootmode="open">
  <style>
    :host {
      display: block;
      font: 400 var(--fs-body, 16px)/1.6 inherit;
    }

    ::slotted(ul) {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    ::slotted(li) {
      padding: var(--space-1, 4px) 0;
      list-style: none;
    }
    ::slotted(details) {
      margin: 0;
      padding-inline-start: var(--space-4, 24px);
    }
    .x-tree-ul { list-style:none; }
  </style>
  <slot></slot>

<script>
/* Remove list-style from nested <ul>'s */
const slot = this.el.shadowRoot.querySelector("slot");
slot.assignedElements().forEach(root => {
    root.querySelectorAll("ul").forEach(ul => ul.style.listStyle = "none" );
});
</script>
</template>
