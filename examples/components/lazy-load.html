<!--
  @component lazy-load
  @description Defers rendering of heavy content until it enters the viewport. The content lives inside a <template> and is materialized into the DOM when the component becomes visible.
  @usage <lazy-load><template><heavy-component>...</heavy-component></template></lazy-load>
  @impl Uses IntersectionObserver. When the host enters the viewport, the <template> content is cloned and inserted. Emits `lazy-load:visible` for infinite scroll scenarios.
-->
<template shadowrootmode="open" threshold:string="0" root-margin:string="0px" once:boolean="true">
<style>
  :host { display: block; }
  :host([loaded]) { display: contents; }
</style>
<slot></slot>

<script>
const host = this
const tpl = host.el.querySelector('template')
if (!tpl) return

const threshold = parseFloat(host.threshold) || 0
const rootMargin = host.rootMargin || '0px'
const once = host.once !== false

const observer = new IntersectionObserver((entries) => {
  for (const entry of entries) {
    if (!entry.isIntersecting) continue

    const frag = tpl.content.cloneNode(true)
    host.el.appendChild(frag)
    host.el.setAttribute('loaded', '')

    host.el.dispatchEvent(new CustomEvent('lazy-load:visible', {
      bubbles: true,
      composed: true,
      detail: { element: host.el }
    }))

    if (once) {
      observer.disconnect()
      return
    }
  }
}, { threshold, rootMargin })

observer.observe(host.el)

host.signal.addEventListener('abort', () => {
  observer.disconnect()
})
</script>
</template>
