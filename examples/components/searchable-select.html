<!--
  @component searchable-select
  @description Searchable dropdown select. Slotted [role="option"] elements. Type to filter, arrow keys, Enter to select. Form-associated.
  @usage <searchable-select><span role="option" value="1">Option</span></searchable-select>
  @impl Click to open panel with search input. Filter options by text match. Keyboard nav (arrows, Enter, Escape). setFormValue on select.
-->
<template shadowrootmode="open">
  <style>
    :host {
      display: block;
      position: relative;
      font: 400 var(--fs-body, 16px)/1.4 inherit;
    }

    .trigger {
      position: relative;
      display: flex;
      align-items: center;
      gap: var(--space-2, 8px);
      padding: var(--space-2, 8px) var(--space-3, 16px);
      border: 1px solid var(--hairline, oklch(0.9 0.01 90));
      border-radius: var(--radius-card, 16px);
      background: var(--bg-card, #fff);
      cursor: pointer;
      transition: border-color .18s ease;
    }

    .trigger:hover {
      border-color: var(--fg-muted, oklch(0.55 0.02 90));
    }

    :host([open]) .trigger {
      border-color: var(--fg, oklch(0.15 0.01 90));
    }

    :host([open]) .search {
      display:block;
    }

    :host([open]) .label {
      display:none;
    }

    .label {
      flex:1;
      min-width:0;
      display:flex;
      align-items:center;
    }

    .selected {
      flex:1;
      min-width:0;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      pointer-events:none;
    }

    .search {
      flex:1;
      min-width:0;
      padding:0;
      border:none;
      background:transparent;
      font:inherit;
      outline:none;
      display:none;
    }

    .search::placeholder {
      color:var(--fg-muted, oklch(0.55 0.02 90));
    }

    .arrow-icon {
      width:0;
      height:0;
      border-inline-start:4px solid transparent;
      border-inline-end:4px solid transparent;
      border-top:5px solid var(--fg-muted, oklch(0.55 0.02 90));
      transition:transform .2s ease;
      flex-shrink:0;
    }

    :host([open]) .arrow-icon {
      transform:rotate(180deg);
    }

    .panel {
      display:none;
      position:absolute;
      top:calc(100% + 4px);
      inset-inline-start:0;
      inset-inline-end:0;
      z-index:100;
      border:1px solid var(--hairline, oklch(0.9 0.01 90));
      border-radius:var(--radius-card, 16px);
      background:var(--bg-card,#fff);
      box-shadow:0 8px 24px oklch(0 0 0 /.12);
      overflow:hidden;
    }

    :host([open]) .panel {
      display:block;
    }

    .options {
      display:flex;
      flex-direction:column;
      max-height:12rem;
      overflow-y:auto;
      scrollbar-width:thin;
      padding:var(--space-1,4px) 0;
    }

    .opt {
      padding:var(--space-2,8px) var(--space-3,16px);
      cursor:pointer;
      transition:background-color .12s ease;
    }

    .opt:hover {
      background:var(--bg, oklch(0.97 0.005 90));
    }

    .opt[selected] {
      background:var(--bg, oklch(0.97 0.005 90));
      font-weight:500;
    }

    /* NUEVO */

    .opt[current] {
      background:var(--bg, oklch(0.94 0.01 90));
    }

  </style>

  <div class="trigger" tabindex="0">

    <input
      class="search"
      type="text"
      placeholder="Type to search…">

    <span class="label">
      <span class="selected">
        <slot name="placeholder">Select…</slot>
      </span>
    </span>

    <span class="arrow-icon"></span>

  </div>

  <div class="panel">
    <div class="options"></div>
  </div>


<script>
const host = this
  const root = host.el.shadowRoot

  const trigger = root.querySelector('.trigger')
  const search = root.querySelector('.search')
  const options = root.querySelector('.options')
  const selected = root.querySelector('.selected')


  let current = -1


  function opts() {
    return options.querySelectorAll('[role="option"]')
  }


  function visibleOpts() {
    return [...opts()].filter(o => o.style.display !== 'none')
  }


  function clearCurrent() {

    opts().forEach(o => {
      o.removeAttribute('current')
    })

  }


  function highlight(index) {

    const list = visibleOpts()

    clearCurrent()

    if (!list.length) {
      current = -1
      return
    }


    if (index < 0)
      index = list.length - 1

    if (index >= list.length)
      index = 0


    current = index

    const option = list[current]

    option.setAttribute('current','')


    option.scrollIntoView({
      block:'nearest'
    })

  }


  function open() {

    host.el.setAttribute('open','')

    search.value=''


    opts().forEach(o => {
      o.style.display=''
    })


    highlight(0)

    search.focus()

  }


  function close() {

    host.el.removeAttribute('open')

    clearCurrent()

    current=-1

  }


  function select(option) {

    if (!option)
      return


    selected.textContent = option.textContent


    opts().forEach(o => {
      o.removeAttribute('selected')
    })


    option.setAttribute('selected','')


    host.el._internals.setFormValue(
      option.getAttribute('value')
      || option.textContent
    )


    close()


    host.el.dispatchEvent(
      new CustomEvent('change',{
        detail:{
          value:
            option.getAttribute('value')
            ||
            option.textContent
        }
      })
    )

  }


  function selectCurrent() {

    const list = visibleOpts()

    if (current < 0)
      return


    select(list[current])

  }


  function move(delta) {

    const list = visibleOpts()

    if (!list.length)
      return


    highlight(current + delta)

  }



  trigger.addEventListener('click',()=>{

    host.el.hasAttribute('open')
      ? close()
      : open()

  }, { signal: host.signal })



  search.addEventListener('input',()=>{

    const q =
      search.value.toLowerCase()


    opts().forEach(o=>{

      const match =
        o.textContent
         .toLowerCase()
         .includes(q)


      o.style.display =
        match ? '' : 'none'

    })


    highlight(0)

  }, { signal: host.signal })



  options.addEventListener('click',e=>{

    const opt =
      e.target.closest('.opt')


    if (!opt)
      return


    select(opt)

  }, { signal: host.signal })



  trigger.addEventListener('keydown',e=>{


    if (!host.el.hasAttribute('open')) {


      if (
        e.key === 'ArrowDown' ||
        e.key === 'Enter'
      ) {

        e.preventDefault()
        open()

      }

      return

    }



    switch(e.key) {


      case 'ArrowDown':

        e.preventDefault()

        move(1)

        break



      case 'ArrowUp':

        e.preventDefault()

        move(-1)

        break



      case 'Enter':

        e.preventDefault()

        selectCurrent()

        break



      case 'Escape':

        e.preventDefault()

        close()

        break



      case 'Home':

        e.preventDefault()

        highlight(0)

        break



      case 'End':

        e.preventDefault()

        highlight(
          visibleOpts().length - 1
        )

        break

    }

  }, { signal: host.signal })



  document.addEventListener('click',e=>{

    if (
      !host.el.contains(e.target) &&
      !root.contains(e.target)
    )
      close()

  }, { signal: host.signal })



  function init() {

    host.el.querySelectorAll('[role="option"]')
      .forEach(o=>{

        o.classList.add('opt')

        options.appendChild(o)

      })


  }


  init()
</script>
</template>
