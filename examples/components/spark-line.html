<!--
  @component spark-line
  @description Mini SVG line chart.
  @usage <spark-line values="12,19,3,5,2,3" stroke="#6366f1"></spark-line>
  @impl Scales the input values to an SVG path. Optional fill area.
-->
<template shadowrootmode="open" values:string="0" stroke:string="var(--accent, oklch(0.55 0.15 145))" fill:string="" width:number="160" height:number="40">
<style>
  :host { display: inline-block; vertical-align: middle; }
  svg { display: block; overflow: visible; }
  path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .area { stroke: none; opacity: .25; }
</style>
<svg part="svg" preserveAspectRatio="none"><path class="line" part="line"/><path class="area" part="area"/></svg>

<script>
const host = this
const root = host.el.shadowRoot
const svg = root.querySelector('svg')
const linePath = root.querySelector('.line')
const areaPath = root.querySelector('.area')
function draw() {
  const nums = String(host.values || '0').split(',').map(v => Number(v.trim())).filter(v => !Number.isNaN(v))
  if (nums.length < 2) { linePath.setAttribute('d', ''); areaPath.setAttribute('d', ''); return }
  const w = host.width || 160
  const h = host.height || 40
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`)
  svg.setAttribute('width', w)
  svg.setAttribute('height', h)
  const min = Math.min(...nums)
  const max = Math.max(...nums)
  const range = max - min || 1
  const pad = 2
  const x = i => pad + (i / (nums.length - 1)) * (w - pad * 2)
  const y = v => h - pad - ((v - min) / range) * (h - pad * 2)
  let d = `M ${x(0)} ${y(nums[0])}`
  for (let i = 1; i < nums.length; i++) d += ` L ${x(i)} ${y(nums[i])}`
  linePath.setAttribute('d', d)
  linePath.setAttribute('stroke', host.stroke || 'var(--accent, oklch(0.55 0.15 145))')
  if (host.fill) {
    areaPath.setAttribute('d', `${d} L ${x(nums.length - 1)} ${h} L ${x(0)} ${h} Z`)
    areaPath.setAttribute('fill', host.fill)
  } else {
    areaPath.setAttribute('d', '')
  }
}
draw()
host.onpropchange = () => draw()
</script>
</template>
