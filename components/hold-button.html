<!--
  @component hold-button
  @category buttons
  @description Hold-to-confirm button. Press and hold 2s to trigger. Emits confirm event, sets confirmed attribute.
  @usage <hold-button>Hold to confirm</hold-button>
  @impl Pointer events with 2s timeout on pointerdown. Fill bar grows via CSS transition. Confirmed state locks button.
-->
<template shadowrootmode="open">
<style>
:host{
    display:inline-block;
}
.hold{
    position:relative;
    padding:var(--space-2,8px) var(--space-4,24px);
    border:2px solid var(--hairline,oklch(.9 .01 90));
    border-radius:var(--radius-pill,999px);
    background:var(--bg-card,#fff);
    color:var(--fg,oklch(.15 .01 90));
    font:inherit;
    cursor:pointer;
    overflow:hidden;
    transition:border-color .2s,color .2s;
    user-select:none;
    -webkit-user-select:none;
    touch-action:manipulation;
}
.hold:active{
    border-color:var(--green,oklch(.55 .15 145));
    color:var(--green,oklch(.55 .15 145));
}
.fill{
    position:absolute;
    inset:0;
    width:0;
    background:var(--green-bg,oklch(.9 .14 150));
    pointer-events:none;
    transition:none;
}
.hold:active .fill{
    width:100%;
    transition:width 2s linear;
}
.label{
    position:relative;
    z-index:1;
    display:flex;
    align-items:center;
    gap:var(--space-1,4px);
}
.check{
    display:none;
    font-size:1.2em;
}
:host([confirmed]) .hold{
    border-color:var(--green,oklch(.55 .15 145));
    background:var(--green-bg,oklch(.9 .14 150));
    cursor:default;
    pointer-events:none;
    color:white;
}
:host([confirmed]) .fill{
    width:100%;
    background:var(--green,oklch(.55 .15 145));
}
:host([confirmed]) .check{
    display:inline;
}
</style>
<button class="hold" part="button">
    <span class="fill" part="fill"></span>
    <span class="label" part="label">
        <span class="check">&#10003;</span>
        <slot></slot>
    </span>
</button>

<script>
const host=this;
const root=host.el.shadowRoot;
const btn=root.querySelector('.hold');
const fill=root.querySelector('.fill');
let timer=null;
let done=false;

function reset(){
    if(timer) clearTimeout(timer);
    timer=null;
    done=false;
    btn.classList.remove('holding');
}

btn.addEventListener('pointerdown',e=>{
    if(host.el.hasAttribute('confirmed')) return;
    reset();
    done=false;
    fill.getBoundingClientRect();
    timer=setTimeout(()=>{
        done=true;
        host.el.setAttribute('confirmed','');
        host.el.dispatchEvent(new CustomEvent('confirm'));
        timer=null;
    },2000);
});

btn.addEventListener('pointerup',reset);
btn.addEventListener('pointerleave',reset);
btn.addEventListener('pointercancel',reset);

host.el.addEventListener('reset',()=>{
    reset();
    host.el.removeAttribute('confirmed');
});

document.addEventListener('click',e=>{
    if(!host.el.contains(e.target)) reset();
});
</script>
</template>
