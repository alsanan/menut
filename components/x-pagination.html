<!--
  @component x-pagination
  @category forms
  @description Pagination component with scrollable page buttons. Attributes: total, page. Emits pagechange event.
  @usage <x-pagination total="10" page="1"></x-pagination>
  @impl Script generates page buttons, scrolls active into view via scrollLeft. Prev/Next buttons. MutationObserver re-renders on attribute change.
-->
<template shadowrootmode="open">
<style>
:host{display:block}
:host([hidden]){display:none}
.wrapper{
  display:flex;
  align-items:center;
  gap:.35rem;
  border-radius:var(--radius-pill,999px);
  padding:0 .5rem;
  width:100%;
  box-sizing:border-box;
}
.scroller{
  display:flex;
  gap:.2rem;
  overflow-x:auto;
  scrollbar-width:none;
  flex:1;
  padding: 0 0 1rem;
}
.scroller::-webkit-scrollbar{display:none}
button{
  flex:0 0 auto;
  min-width:2.25rem;
  height:2.25rem;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0 .65rem;
  border-radius:var(--radius);
  border:none;
  background:var(--bg);
  color:var(--fg);
  font:inherit;
  font-size:var(--fs-sm);
  font-weight:500;
  cursor:pointer;
  box-shadow: 0 0 0 transparent;
  transition:background .5s,color .15s;
  user-select:none;
  white-space:nowrap;
}
button:hover{background:var(--fg);color:var(--bg-card)}
button[aria-current="page"]{
  background:var(--fg);
  color:var(--bg-card);
  border-radius: var(--radius);
  box-shadow:var(--shadow-pop);
}
.nav{
  font-size:1.5rem;
  font-weight:600;
  min-width:2.25rem;
  height:2.25rem;
  padding: .5rem 0 1rem;
  flex-shrink:0;
  background:transparent !important;
  color:var(--fg) !important;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid transparent;
  cursor:pointer;
  transition:border-color .15s;
  margin-bottom:1rem;
}
.nav:hover{ border-color: var(--fg-card); }
.nav:disabled{opacity:.3;cursor:default;pointer-events:none}
.pages{
  display:flex;
  flex-direction:row;
  gap:.2rem;
}
</style>
<div class="wrapper">
  <button class="nav" id="prev" aria-label="Previous page">‹</button>
  <div class="scroller" id="scroller"><div class="pages" id="pages"></div></div>
  <button class="nav" id="next" aria-label="Next page">›</button>
</div>

<script>
const host=this
const root=host.el.shadowRoot
const scroller=root.getElementById('scroller')
const pagesEl=root.getElementById('pages')
const prevBtn=root.getElementById('prev')
const nextBtn=root.getElementById('next')

scroller.addEventListener('wheel',e=>{
  if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){e.preventDefault();scroller.scrollLeft+=e.deltaY}
},{passive:false})

function ga(n){return parseInt(host.el.getAttribute(n))}
function total(){return Math.max(1,ga('total')||1)}
function page(){return Math.max(1,Math.min(ga('page')||1,total()))}

function render(){
  const t=total(),c=page()
  pagesEl.innerHTML=''
  for(let i=1;i<=t;i++){
    const b=document.createElement('button')
    b.textContent=i
    b.setAttribute('aria-label','Page '+i)
    if(i===c)b.setAttribute('aria-current','page')
    b.addEventListener('click',()=>{
      host.el.setAttribute('page',i)
      host.el.dispatchEvent(new CustomEvent('pagechange',{detail:{page:i}}))
    })
    pagesEl.appendChild(b)
  }
  prevBtn.disabled=c<=1
  nextBtn.disabled=c>=t
  host.el.toggleAttribute('hidden',t<=1)
  requestAnimationFrame(()=>{
    const cur=pagesEl.querySelector('[aria-current="page"]')
    if(cur&&host.el.getBoundingClientRect().top<window.innerHeight&&host.el.getBoundingClientRect().bottom>0){
      const cr=cur.getBoundingClientRect(),sr=scroller.getBoundingClientRect()
      scroller.scrollLeft+=cr.left-sr.left-sr.width/2+cr.width/2
    }
  })
}

const obs=new MutationObserver(render)
obs.observe(host.el,{attributes:true,attributeFilter:['total','page']})
render()
prevBtn.addEventListener('click',()=>{
  const p=Math.max(1,page()-1)
  host.el.setAttribute('page',p)
  host.el.dispatchEvent(new CustomEvent('pagechange',{detail:{page:p}}))
})
nextBtn.addEventListener('click',()=>{
  const p=Math.min(total(),page()+1)
  host.el.setAttribute('page',p)
  host.el.dispatchEvent(new CustomEvent('pagechange',{detail:{page:p}}))
})
</script>
</template>
