<!--
  @component virtual-list
  @category content
  @description Slot-based visibility virtualizer. Uses IntersectionObserver to add a visible class to items on screen while keeping off-screen items rendered but content-hidden.
  @usage <virtual-list style="height:20rem;overflow:auto"><div>item 1</div>...</virtual-list>
  @impl Observes slotted children and toggles the `visible` class. Also applies content-visibility:auto for performance.
-->
<template shadowrootmode="open">
<style>
  :host { display: block; }
  ::slotted(*) { content-visibility: auto; contain-intrinsic-size: auto 3rem; }
  ::slotted(.visible) { content-visibility: visible; }
</style>
<slot></slot>

<script>
const host = this
const slot = host.el.shadowRoot.querySelector('slot')
const observer = new IntersectionObserver((entries) => {
  for (const e of entries) {
    e.target.classList.toggle('visible', e.isIntersecting)
  }
}, { root: host.el, threshold: 0 })
function observe() {
  for (const el of slot.assignedElements({ flatten: true })) {
    if (el.nodeType === 1) observer.observe(el)
  }
}
observe()
slot.addEventListener('slotchange', observe)
host._cleanup = () => {
  observer.disconnect()
}
</script>
</template>
