<!--
  @component date-time
  @category content
  @description Live date/time formatter with PHP-style format (date() syntax) that auto-updates. Adds [relative] to show a localized relative time instead.
  @usage <date-time format="H:i:s"></date-time> · <date-time format="d/m/Y H:i" date="2026-08-11T10:30:00" relative></date-time> · <date-time format="i:s" relative lang="es"></date-time>
  @impl
    - [format] accepts PHP date() characters (see docs). Unrecognized chars are output as-is; "\X" escapes.
    - Auto-refresh: every 1s if the format has seconds (s), every 1min if it has minutes (i), every 1h otherwise.
    - [date] sets the reference date (timestamp or parseable string); default = now.
    - [relative] shows a localized relative time (via Intl.RelativeTimeFormat) instead of the formatted value, choosing the unit from the smallest time token in [format].
    - [lang] locale for month/day names and relative text (Intl); default "en".
    - Uses the instance AbortController (this.signal) to stop the timer on disconnect.
-->
<template>
  <style>:host { display: inline; }</style>
  <script>
  const host = this
  const lang = host.el.getAttribute('lang') || 'en'

  const pad = (n, l = 2) => String(n).padStart(l, '0')
  // Nombres localizados de mes y día (Intl).
  const fmtMonth = new Intl.DateTimeFormat(lang, { month: 'long' })
  const fmtMonthS = new Intl.DateTimeFormat(lang, { month: 'short' })
  const fmtDay = new Intl.DateTimeFormat(lang, { weekday: 'long' })
  const fmtDayS = new Intl.DateTimeFormat(lang, { weekday: 'short' })

  function isoWeek(date) {
    const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()))
    d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7))
    const y = d.getUTCFullYear()
    return Math.ceil((((d - Date.UTC(y, 0, 1)) / 86400000) + 1) / 7)
  }

  function fmt(date, format) {
    const y = date.getFullYear(), mo = date.getMonth(), d = date.getDate()
    const h = date.getHours(), mi = date.getMinutes(), s = date.getSeconds()
    const h12 = h % 12 || 12
    const off = -date.getTimezoneOffset()
    const os = off >= 0 ? '+' : '-', oa = Math.abs(off)
    const op = os + pad(Math.floor(oa / 60)) + ':' + pad(oa % 60)
    const map = {
      d: () => pad(d), j: () => d, m: () => pad(mo + 1), n: () => mo + 1,
      Y: () => y, y: () => pad(y % 100),
      F: () => fmtMonth.format(date), M: () => fmtMonthS.format(date),
      l: () => fmtDay.format(date), D: () => fmtDayS.format(date),
      N: () => date.getDay() || 7, w: () => date.getDay(),
      z: () => Math.floor((date - new Date(y, 0, 0)) / 86400000),
      t: () => new Date(y, mo + 1, 0).getDate(),
      L: () => ((y % 4 === 0 && y % 100 !== 0) || y % 400 === 0) ? 1 : 0,
      W: () => isoWeek(date),
      H: () => pad(h), G: () => h, h: () => pad(h12), g: () => h12,
      i: () => pad(mi), s: () => pad(s),
      A: () => h < 12 ? 'AM' : 'PM', a: () => h < 12 ? 'am' : 'pm',
      U: () => Math.floor(date.getTime() / 1000),
      T: () => /\(([^)]+)\)/.exec(String(date))?.[1] || '',
      P: () => op, O: () => op.replace(':', ''),
      e: () => Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC',
      c: () => `${pad(y)}-${pad(mo + 1)}-${pad(d)}T${pad(h)}:${pad(mi)}:${pad(s)}${op}`,
      r: () => date.toUTCString()
    }
    let out = ''
    for (let i = 0; i < format.length; i++) {
      const ch = format[i]
      if (ch === '\\') { out += format[++i] || ''; continue }
      out += map[ch] ? map[ch]() : ch
    }
    return out
  }

  // Unidad mínima según el formato: s → segundos, i → minutos,
  // H/h/g/G/A/a → horas, si no → días.
  function unit(format) {
    if (/s/.test(format)) return ['second', 1000]
    if (/i/.test(format)) return ['minute', 60000]
    if (/[HGhgaA]/.test(format)) return ['hour', 3600000]
    return ['day', 86400000]
  }

  const rtf = new Intl.RelativeTimeFormat(lang, { numeric: 'always' })

  function render() {
    const format = host.el.getAttribute('format') || 'd/m/Y H:i'
    let date = new Date()
    const dateAttr = host.el.getAttribute('date')
    if (dateAttr) {
      const ts = /^\d+$/.test(dateAttr) ? Number(dateAttr) : Date.parse(dateAttr)
      if (!isNaN(ts)) date = new Date(ts)
    }
    if (host.el.hasAttribute('relative')) {
      const [u, ms] = unit(format)
      const diff = Math.floor((date.getTime() - Date.now()) / ms)   // pasado → negativo
      host.el.textContent = rtf.format(diff, u)
    } else {
      host.el.textContent = fmt(date, format)
    }
  }

  render()
  const [, ms] = unit(host.el.getAttribute('format') || 'd/m/Y H:i')
  const timer = setInterval(render, ms)
  // ciclo de vida: el timer se detiene al desconectar el elemento
  this.signal.addEventListener('abort', () => clearInterval(timer), { once: true })
  </script>
</template>
