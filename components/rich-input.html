  @attr placeholder – Placeholder text.
  @attr name – Form field name (participates in <form> submission).
  @attr disabled – Disables the control.
  @attr operators – Space-separated prefix operators (default "-"). E.g. "- ~ +".
  @attr combinators – Space-separated boolean combinators (default none). E.g. "AND OR".
  @attr delimiters – Space-separated delimiter pairs (default "()"). E.g. "() [] {}".
  @attr highlight-quotes – Set to "exclude" to keep quotes unhighlighted.
  @impl Faithful port of bramus/rich-input. Nested <datalist id label data-type> define keywords and options; <option> may contain an <img> for rich suggestions. Tokenizer + caret context drive a keyword/value/combinator autocomplete popover (HTML Popover API). In-input highlighting uses OpaqueRange (Chromium 152+) or a [contenteditable] fallback (Safari 17.2+/Firefox 141+). CSS Custom Highlight API paints ::highlight(label), ::highlight(rich-input-keyword|operator|combinator|delimiter|invalid). Public API: value, operators, combinators, delimiters, getParsedQuery(), getKeywords(), focus/blur/select/setSelectionRange. Events: input, change, search, rich-input-select.
