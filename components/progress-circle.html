<!--
  @component progress-circle
  @category data
  @description Circular progress ring. Single value (one arc) or comma-separated values (multi-arc ring). Colors via --chart-1..--chart-N. Each arc gets a matching drop-shadow. CSS var: --value, --stroke, --gap.
  @usage <progress-circle style="--value:60,25,15;--chart-1:#5394fd;--chart-2:#f59e0b;--chart-3:#10b981">slot text</progress-circle>
  @impl SVG circle with stroke-dasharray/-offset. Script reads --value from computed style, generates arcs with gaps. SVG feDropShadow on each arc. MutationObserver re-renders on style change.
-->
<template shadowrootmode="open">
<style>
:host {
  --size: 8rem;
  --stroke: 8;
  --value: 75;
  --gap: 4;
  display: inline-block;
  padding: 15px 0;
}
svg {
  overflow: visible;
  width: var(--size);
  aspect-ratio: 1;
}
.progress {
  transform: rotate(-90deg);
  transform-origin: center;
}
circle {
  fill: none;
  stroke-width: var(--stroke);
}
.bg { stroke: #ddd; }
.arc {
  stroke-linecap: round;
  transition: .35s;
}
</style>
<div class="center">
  <svg viewBox="-5 -5 110 110">
    <defs>
      <filter id="g" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="0" stdDeviation="3.5" flood-color="var(--shadow-clr,oklch(0 0 0 / 0.35))" flood-opacity="1"/>
      </filter>
    </defs>
    <g class="progress">
      <circle cx="50" cy="50" r="45" class="bg"/>
    </g>
  </svg>
  <slot></slot>
</div>

<script>
const host = this;
const root = host.el.shadowRoot;
const g = root.querySelector('.progress');
const R = 45;
const C = 2 * Math.PI * R;

function getValues() {
  const style = getComputedStyle(host.el);
  const val = (style.getPropertyValue('--value') || '75').trim();
  return val.split(',').map(v => parseFloat(v.trim())).filter(v => !isNaN(v));
}

function getStroke() {
  return parseFloat(getComputedStyle(host.el).getPropertyValue('--stroke')) || 8;
}

function render() {
  const values = getValues();
  const stroke = getStroke();
  const rawTotal = values.reduce((a, b) => a + b, 0);
  if (rawTotal === 0) return;

  g.querySelectorAll('.arc').forEach(a => a.remove());

  // Normalise to a minimum denominator of 100 so single values
  // like --value:75 render as 75% of the circle, not 100%.
  const total = Math.max(rawTotal, 100);

  const num = values.length;
  const gapDeg = num > 1 ? 3 : 0;
  const gap = (gapDeg / 360) * C;
  const totalGap = gap * (num - 1);
  const available = C - totalGap;

  let offset = 0;

  // Resolve a CSS var to a concrete colour string
  function chartColor(i) {
    const cs = getComputedStyle(host.el);
    const c = cs.getPropertyValue(`--chart-${i}`).trim();
    if (c && !c.startsWith('var(')) return c;
    const a = cs.getPropertyValue('--accent').trim();
    if (a && !a.startsWith('var(')) return a;
    return '#5394fd';
  }

  values.forEach((v, i) => {
    const len = (v / total) * available;
    const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    circle.setAttribute('cx', '50');
    circle.setAttribute('cy', '50');
    circle.setAttribute('r', R);
    circle.classList.add('arc');
    circle.style.stroke = `var(--chart-${i + 1}, var(--accent, #5394fd))`;
    circle.style.strokeDasharray = `${len} ${C - len}`;
    circle.style.strokeDashoffset = -offset;

    circle.style.filter = 'url(#g)';
    circle.style.setProperty('--shadow-clr', chartColor(i + 1));

    g.appendChild(circle);
    offset += len + gap;
  });
}

const obs = new MutationObserver(() => render());
obs.observe(host.el, { attributes: true, attributeFilter: ['style'] });
render();
</script>
</template>
