<!--
  @component dot-display
  @category text
  @description Pixel dot-matrix display. API: pixel(x,y,color), clear(), fill(), text(), scrollText(), etc. CSS vars: --width, --height, --dot-gap, --dot-size, --dot-shape. 4-color palette (--color0..--color3).
  @usage <dot-display style="--width:64;--height:16"></dot-display>
  @sizing Resolution (--width/--height, number of dots) and dot size (--dot-gap/--dot-size) are decoupled from the final on-screen size, which is controlled purely via CSS (width/height/aspect-ratio) on the host element.
  @impl SVG matrix with circle/rect/polygon dots. Renders only render when dirty (no perpetual RAF loop). scrollText() uses a duplicated bitmap layer animated with a pure CSS transform (GPU-composited, zero per-frame JS). Includes 5x7 CP437 bitmap font (glcdfont) with a Unicode->CP437 mapping so Valencian/Catalan diacritics (à è ò ç ï ü ñ ·) render correctly.
-->
<template shadowrootmode="open">

<style>
:host{
    --width:64;
    --height:16;

    --dot-gap:6;
    --dot-size:2;
    --dot-size-on:5;

    --dot-shape:circle;

    --color0:var(--hairline,#ddd);
    --color1:#aaa;
    --color2:#666;
    --color3:#000;

    display:inline-block;
    /* el host recibe un width/height en px del script; no dejar que desborde
       el contenedor (el SVG escala con preserveAspectRatio) */
    max-width:100%;
}

svg{
    display:block;
    width:100%;
    height:100%;
    overflow:hidden;
    background:transparent;
}

circle,
rect,
polygon{
    transition:
        fill .08s linear,
        r .08s linear;
}
</style>

<svg part="display"></svg>


<script>
const host=this;
const root=host.el.shadowRoot;
const svg=root.querySelector("svg");

const NS="http://www.w3.org/2000/svg";

const width=Number(getComputedStyle(host.el).getPropertyValue("--width")||64);
const height=Number(getComputedStyle(host.el).getPropertyValue("--height")||16);

const gap=Number(
    getComputedStyle(host.el)
    .getPropertyValue("--dot-gap")
)||6;

const offSize=Number(
    getComputedStyle(host.el)
    .getPropertyValue("--dot-size")
)||2;

const onSize=Number(
    getComputedStyle(host.el)
    .getPropertyValue("--dot-size-on")
)||5;

const shape=
    getComputedStyle(host.el)
    .getPropertyValue("--dot-shape")
    .trim()||"circle";

const pitch=gap;

const speedMultiplier=Number(
    getComputedStyle(host.el)
    .getPropertyValue("--speed")
)||1;

if (host.el.hasAttribute('marquee')) setTimeout( ()=>host.scrollText(host.el.getAttribute('marquee') , {y:1,speed:60*speedMultiplier}) , 1000);
if (host.el.hasAttribute('text')) setTimeout( ()=>host.text(host.el.getAttribute('text'),1,1) , 1000);

svg.setAttribute(
    "viewBox",
    `0 0 ${width*pitch} ${height*pitch}`
);
svg.setAttribute("preserveAspectRatio","xMidYMid meet");

// Size the component so 1 viewBox unit = 1 CSS pixel.
// --width and --height control the dot count; --dot-gap controls cell pitch.
// To scale the whole display, adjust --dot-gap / --dot-size / --dot-size-on.
host.el.style.width=(width*pitch)+'px';
host.el.style.height=(height*pitch)+'px';

const leds=new Array(width*height);
const fb=new Uint8Array(width*height);

const dirtyPixels=new Set();
let rafPending=false;

const layer=document.createElementNS(NS,"g");
svg.append(layer);

function createLed(x,y){
    let el;
    switch(shape){
        case "square":
            el=document.createElementNS(NS,"rect");
            el.setAttribute("x",x-offSize/2);
            el.setAttribute("y",y-offSize/2);
            el.setAttribute("width",offSize);
            el.setAttribute("height",offSize);
            break;
        case "diamond":
            el=document.createElementNS(NS,"polygon");
            el.setAttribute(
                "points",
                [
                    `${x},${y-offSize/2}`,
                    `${x+offSize/2},${y}`,
                    `${x},${y+offSize/2}`,
                    `${x-offSize/2},${y}`
                ].join(" ")
            );
            break;
        default:
            el=document.createElementNS(NS,"circle");
            el.setAttribute("cx",x);
            el.setAttribute("cy",y);
            el.setAttribute("r",offSize/2);
    }
    el.setAttribute("fill","var(--color0)");
    return el;
}

let p=0;

for(let y=0;y<height;y++){
    for(let x=0;x<width;x++){
        const led=createLed(
            x*pitch+pitch/2,
            y*pitch+pitch/2
        );
        leds[p++]=led;
        layer.append(led);
    }
}

function updatePixel(i){
    const led=leds[i];
    const color=fb[i];
    led.setAttribute(
        "fill",
        `var(--color${color})`
    );
    if(shape==="circle"){
        led.setAttribute(
            "r",
            color
                ? onSize/2
                : offSize/2
        );
    }else
    if(shape==="square"){
        const s=color
            ? onSize
            : offSize;
        const cx=Number(led.getAttribute("x"))+Number(led.getAttribute("width"))/2;
        const cy=Number(led.getAttribute("y"))+Number(led.getAttribute("height"))/2;
        led.setAttribute("x",cx-s/2);
        led.setAttribute("y",cy-s/2);
        led.setAttribute("width",s);
        led.setAttribute("height",s);
    }
}

function render(){
    dirtyPixels.forEach(updatePixel);
    dirtyPixels.clear();
    rafPending=false;
}

function scheduleRender(){
    if(rafPending) return;
    rafPending=true;
    requestAnimationFrame(render);
}

function index(x,y){
    return y*width+x;
}

function inside(x,y){
    return (
        x>=0 &&
        x<width &&
        y>=0 &&
        y<height
    );
}

function put(x,y,color){
    if(!inside(x,y)) return;
    const i=index(x,y);
    color&=3;
    if(fb[i]===color) return;
    fb[i]=color;
    dirtyPixels.add(i);
    scheduleRender();
}

host.width=width;
host.height=height;
host.buffer=fb;

host.pixel=function(x,y,color=3){
    put(x|0,y|0,color);
    return this;
};

host.get=function(x,y){
    if(!inside(x,y)) return 0;
    return fb[index(x,y)];
};

host.clear=function(){
    for(let i=0;i<fb.length;i++){
        if(fb[i]===0) continue;
        fb[i]=0;
        dirtyPixels.add(i);
    }
    if(dirtyPixels.size) scheduleRender();
    return this;
};

host.fill=function(color=3){
    color&=3;
    for(let i=0;i<fb.length;i++){
        if(fb[i]===color) continue;
        fb[i]=color;
        dirtyPixels.add(i);
    }
    if(dirtyPixels.size) scheduleRender();
    return this;
};

host.refresh=function(){
    dirtyPixels.clear();
    for(let i=0;i<fb.length;i++)
        dirtyPixels.add(i);
    scheduleRender();
    return this;
};

host.hline=function(x1,x2,y,color=3){
    if(y<0 || y>=height) return this;
    x1|=0;
    x2|=0;
    if(x1>x2)
        [x1,x2]=[x2,x1];
    x1=Math.max(0,x1);
    x2=Math.min(width-1,x2);
    for(let x=x1;x<=x2;x++)
        put(x,y,color);
    return this;
};

host.vline=function(x,y1,y2,color=3){
    if(x<0 || x>=width)
        return this;
    y1|=0;
    y2|=0;
    if(y1>y2)
        [y1,y2]=[y2,y1];
    y1=Math.max(0,y1);
    y2=Math.min(height-1,y2);
    for(let y=y1;y<=y2;y++)
        put(x,y,color);
    return this;
};

host.line=function(x0,y0,x1,y1,color=3){
    x0|=0;
    y0|=0;
    x1|=0;
    y1|=0;
    let dx=Math.abs(x1-x0);
    let sx=x0<x1?1:-1;
    let dy=-Math.abs(y1-y0);
    let sy=y0<y1?1:-1;
    let err=dx+dy;
    while(true){
        put(x0,y0,color);
        if(x0===x1 && y0===y1)
            break;
        const e2=err<<1;
        if(e2>=dy){
            err+=dy;
            x0+=sx;
        }
        if(e2<=dx){
            err+=dx;
            y0+=sy;
        }
    }
    return this;
};

host.rect=function(x,y,w,h,color=3){
    this.hline(x,x+w-1,y,color);
    this.hline(x,x+w-1,y+h-1,color);
    this.vline(x,y,y+h-1,color);
    this.vline(x+w-1,y,y+h-1,color);
    return this;
};

host.fillRect=function(x,y,w,h,color=3){
    for(let yy=y;yy<y+h;yy++)
        this.hline(x,x+w-1,yy,color);
    return this;
};

host.circle=function(cx,cy,r,color=3){
    let x=r;
    let y=0;
    let err=1-r;
    while(x>=y){
        put(cx+x,cy+y,color);
        put(cx+y,cy+x,color);
        put(cx-y,cy+x,color);
        put(cx-x,cy+y,color);
        put(cx-x,cy-y,color);
        put(cx-y,cy-x,color);
        put(cx+y,cy-x,color);
        put(cx+x,cy-y,color);
        y++;
        if(err<0){
            err+=2*y+1;
        }else{
            x--;
            err+=2*(y-x+1);
        }
    }
    return this;
};

host.fillCircle=function(cx,cy,r,color=3){
    let x=r;
    let y=0;
    let err=1-r;
    while(x>=y){
        this.hline(cx-x,cx+x,cy+y,color);
        this.hline(cx-x,cx+x,cy-y,color);
        this.hline(cx-y,cx+y,cy+x,color);
        this.hline(cx-y,cx+y,cy-x,color);
        y++;
        if(err<0){
            err+=2*y+1;
        }else{
            x--;
            err+=2*(y-x+1);
        }
    }
    return this;
};

const FONT_WIDTH=5;
const FONT_HEIGHT=7;

// Unicode -> CP437 map, only the code points the glcdfont bitmap actually
// has glyphs for (needed for Valencian/Catalan: à è ò ç ï ü ñ i el punt volat ·).
const CP437_MAP={
    'Ç':0x80,'ü':0x81,'é':0x82,'â':0x83,'ä':0x84,'à':0x85,'å':0x86,'ç':0x87,
    'ê':0x88,'ë':0x89,'è':0x8A,'ï':0x8B,'î':0x8C,'ì':0x8D,'Ä':0x8E,'Å':0x8F,
    'É':0x90,'æ':0x91,'Æ':0x92,'ô':0x93,'ö':0x94,'ò':0x95,'û':0x96,'ù':0x97,
    'ÿ':0x98,'Ö':0x99,'Ü':0x9A,'á':0xA0,'í':0xA1,'ó':0xA2,'ú':0xA3,'ñ':0xA4,
    'Ñ':0xA5,'¿':0xA8,'·':0xFA
};

function codeFor(ch){
    const code=ch.codePointAt(0);
    if(code<128) return code;
    if(CP437_MAP[ch]!==undefined) return CP437_MAP[ch];
    // Fallback for characters the font has no glyph for (e.g. uppercase
    // À/È/Ò, absent from CP437): strip the diacritic rather than show garbage.
    const stripped=ch.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    if(stripped && stripped!==ch){
        const sc=stripped.codePointAt(0);
        if(sc<128) return sc;
        if(CP437_MAP[stripped]!==undefined) return CP437_MAP[stripped];
    }
    return 32;
}

function glyph(code){
    if(code<0 || code>255) code=32;
    return code*FONT_WIDTH;
}

host.char=function(ch,x,y,color=3){
    const code=typeof ch==="number" ? ch : codeFor(ch);
    let p=glyph(code);
    for(let xx=0;xx<FONT_WIDTH;xx++){
        let bits=FONT0[p++];
        for(let yy=0;yy<FONT_HEIGHT;yy++){
            if(bits & (1<<yy))
                this.pixel(x+xx,y+yy,color);
        }
    }
    return this;
};

host.text=function(text,x,y,color=3){
    let xx=x;
    for(const ch of String(text)){
        this.char(ch,xx,y,color);
        xx+=FONT_WIDTH+1;
    }
    return this;
};

host.measureText=function(text){
    return text.length*(FONT_WIDTH+1)-1;
};

// --- scrollText: rendered once, then scrolled with a pure CSS transform
// animation (GPU-composited). No per-frame JS work at all.

let marqueeWrapper=null;
let marqueeStyle=null;

function buildMessageCols(str){
    const cols=[];
    for(const ch of str){
        const code=codeFor(ch);
        let p=glyph(code);
        for(let c=0;c<FONT_WIDTH;c++) cols.push(FONT0[p+c]);
        cols.push(0); // 1px gap between characters
    }
    if(cols.length) cols.pop();
    return cols;
}

function buildMessageGroup(cols,y,color){
    const g=document.createElementNS(NS,"g");
    for(let x=0;x<cols.length;x++){
        const bits=cols[x];
        if(!bits) continue;
        for(let row=0;row<FONT_HEIGHT;row++){
            if(bits & (1<<row)){
                const led=createLed(
                    x*pitch+pitch/2,
                    (y+row)*pitch+pitch/2
                );
                led.setAttribute("fill",`var(--color${color})`);
                if(shape==="circle") led.setAttribute("r",onSize/2);
                g.append(led);
            }
        }
    }
    return g;
}

host.stopScroll=function(){
    if(marqueeWrapper){
        marqueeWrapper.remove();
        marqueeWrapper=null;
    }
    if(marqueeStyle){
        marqueeStyle.remove();
        marqueeStyle=null;
    }
    return this;
};

host.scrollText=function(
    text,
    {
        y=0,
        color=3,
        speed=60, // pixels (logical dot-grid units) per second
        loop=true
    }={}
){
    this.stopScroll();

    const str=String(text).toUpperCase();
    const cols=buildMessageCols(str);
    if(!cols.length) return this;

    const msgWidth=cols.length; // in logical units, 1 col = 1 unit = pitch px
    const totalDist=msgWidth*pitch;
    const displayWidth=width*pitch;
    const startX=displayWidth;

    const wrapper=document.createElementNS(NS,"g");
    wrapper.style.transform=`translateX(${startX}px)`;

    const grp1=buildMessageGroup(cols,y,color);
    wrapper.append(grp1);

    if(loop){
        const grp2=buildMessageGroup(cols,y,color);
        grp2.setAttribute("transform",`translate(${totalDist},0)`);
        wrapper.append(grp2);
    }

    svg.append(wrapper);
    marqueeWrapper=wrapper;

    const animName=`dotscroll_${Math.random().toString(36).slice(2,8)}`;
    const endX=loop ? (startX-totalDist) : -totalDist;
    const distance=loop ? totalDist : (startX+totalDist);
    const duration=Math.max(distance/speed,0.01);

    marqueeStyle=document.createElement("style");
    marqueeStyle.textContent=`
        @keyframes ${animName}{
            to{ transform:translateX(${endX}px); }
        }
        .${animName}{
            animation:${animName} ${duration}s linear ${loop?"infinite":"1"};
            animation-fill-mode:${loop?"none":"forwards"};
        }
    `;
    root.append(marqueeStyle);
    wrapper.classList.add(animName);

    if(!loop){
        wrapper.addEventListener("animationend",()=>{
            host.el.dispatchEvent(new CustomEvent("scrollend"));
        },{once:true});
    }

    return this;
};
