<!--
  @component address-input
  @category forms
  @description Address form component that auto-fills city and state from postal code via zippopotam.us API. Outputs a structured address object usable in forms. Supports all countries with ISO 3166-1 alpha-2 codes.
  @usage <address-input name="shipping"></address-input> · <address-input name="billing" country="ES"></address-input>
  @attr name – Form field prefix (default "address"). Each sub-field gets name="{name}[country]", "{name}[postal_code]", etc.
  @attr country – Default country ISO code (e.g. "US", "ES"). If omitted, detects via ipapi.co.
  @impl Uses zippopotam.us for postal code → city/state lookup. Dispatches address-change event with structured {country, postal_code, city, state, street, number} object. All sub-fields are real <input>/<select> elements that participate in native form submission.
-->
<template shadowrootmode="open">
<style>
:host { display: block; }
.address-form {
  display: grid;
  gap: .5rem;
  font-family: var(--font, system-ui, sans-serif);
}
.address-form select,
.address-form input {
  font: inherit;
  padding: .45rem .6rem;
  border: 1px solid var(--hairline, oklch(0.88 0.01 90));
  border-radius: var(--radius-btn, 6px);
  background: var(--bg, #fff);
  color: var(--fg, oklch(0.2 0 0));
  width: 100%;
  box-sizing: border-box;
}
.address-form select:focus,
.address-form input:focus {
  outline: 2px solid var(--accent, oklch(0.55 0.15 260));
  outline-offset: -1px;
}
.address-row {
  display: grid;
  gap: .5rem;
}
.address-row-3 { grid-template-columns: 2fr 1fr 1fr; }
.address-row-2 { grid-template-columns: 1fr 1fr; }
@media (max-width: 480px) {
  .address-row-3, .address-row-2 { grid-template-columns: 1fr; }
}
.address-status {
  font-size: var(--fs-xs, 0.72rem);
  color: var(--fg-muted, oklch(0.5 0 0));
  min-height: 1em;
  margin: 0;
}
.address-status.error { color: var(--err, oklch(0.6 0.22 25)); }
</style>

<div class="address-form">
  <select class="address-country" :name="name + '[country]'" autocomplete="country" required>
    <option value="">Select country</option>
  </select>

  <div class="address-row address-row-3">
    <input class="address-postal" :name="name + '[postal_code]'" placeholder="Postal code" autocomplete="postal-code" required>
    <input class="address-city" :name="name + '[city]'" list="" placeholder="City" autocomplete="address-level2" required>
    <input class="address-state" :name="name + '[state]'" placeholder="State/Province" autocomplete="address-level1">
  </div>

  <div class="address-row address-row-2">
    <input class="address-street" :name="name + '[street]'" placeholder="Street" autocomplete="address-line1" required>
    <input class="address-number" :name="name + '[number]'" placeholder="Number" autocomplete="address-line2">
  </div>

  <p class="address-status"></p>
</div>

<script>
const host = this
const el = host.el
const root = el.shadowRoot

const API = 'https://api.zippopotam.us'

let _debounceTimer = null
let _currentData = null
let _status = null

function $(sel) { return root.querySelector(sel) }

function setStatus(msg, isError) {
  _status = _status || $('.address-status')
  if (_status) {
    _status.textContent = msg
    _status.classList.toggle('error', !!isError)
  }
}

function getSelectedCountry() {
  return $('.address-country').value
}

const COUNTRIES = [["AF","Afghanistan"],["AL","Albania"],["DZ","Algeria"],["AD","Andorra"],["AO","Angola"],["AG","Antigua and Barbuda"],["AR","Argentina"],["AM","Armenia"],["AU","Australia"],["AT","Austria"],["AZ","Azerbaijan"],["BS","Bahamas"],["BH","Bahrain"],["BD","Bangladesh"],["BB","Barbados"],["BY","Belarus"],["BE","Belgium"],["BZ","Belize"],["BJ","Benin"],["BT","Bhutan"],["BO","Bolivia"],["BA","Bosnia and Herzegovina"],["BW","Botswana"],["BR","Brazil"],["BN","Brunei"],["BG","Bulgaria"],["BF","Burkina Faso"],["BI","Burundi"],["CV","Cabo Verde"],["KH","Cambodia"],["CM","Cameroon"],["CA","Canada"],["CF","Central African Republic"],["TD","Chad"],["CL","Chile"],["CN","China"],["CO","Colombia"],["KM","Comoros"],["CG","Congo"],["CD","Congo, DR"],["CR","Costa Rica"],["HR","Croatia"],["CU","Cuba"],["CY","Cyprus"],["CZ","Czech Republic"],["DK","Denmark"],["DJ","Djibouti"],["DM","Dominica"],["DO","Dominican Republic"],["EC","Ecuador"],["EG","Egypt"],["SV","El Salvador"],["GQ","Equatorial Guinea"],["ER","Eritrea"],["EE","Estonia"],["SZ","Eswatini"],["ET","Ethiopia"],["FJ","Fiji"],["FI","Finland"],["FR","France"],["GA","Gabon"],["GM","Gambia"],["GE","Georgia"],["DE","Germany"],["GH","Ghana"],["GR","Greece"],["GD","Grenada"],["GT","Guatemala"],["GN","Guinea"],["GW","Guinea-Bissau"],["GY","Guyana"],["HT","Haiti"],["HN","Honduras"],["HU","Hungary"],["IS","Iceland"],["IN","India"],["ID","Indonesia"],["IR","Iran"],["IQ","Iraq"],["IE","Ireland"],["IL","Israel"],["IT","Italy"],["JM","Jamaica"],["JP","Japan"],["JO","Jordan"],["KZ","Kazakhstan"],["KE","Kenya"],["KI","Kiribati"],["KR","South Korea"],["KW","Kuwait"],["KG","Kyrgyzstan"],["LA","Laos"],["LV","Latvia"],["LB","Lebanon"],["LS","Lesotho"],["LR","Liberia"],["LY","Libya"],["LI","Liechtenstein"],["LT","Lithuania"],["LU","Luxembourg"],["MG","Madagascar"],["MW","Malawi"],["MY","Malaysia"],["MV","Maldives"],["ML","Mali"],["MT","Malta"],["MH","Marshall Islands"],["MR","Mauritania"],["MU","Mauritius"],["MX","Mexico"],["FM","Micronesia"],["MD","Moldova"],["MC","Monaco"],["MN","Mongolia"],["ME","Montenegro"],["MA","Morocco"],["MZ","Mozambique"],["MM","Myanmar"],["NA","Namibia"],["NP","Nepal"],["NL","Netherlands"],["NZ","New Zealand"],["NI","Nicaragua"],["NE","Niger"],["NG","Nigeria"],["NO","Norway"],["OM","Oman"],["PK","Pakistan"],["PA","Panama"],["PG","Papua New Guinea"],["PY","Paraguay"],["PE","Peru"],["PH","Philippines"],["PL","Poland"],["PT","Portugal"],["QA","Qatar"],["RO","Romania"],["RU","Russia"],["RW","Rwanda"],["KN","Saint Kitts and Nevis"],["LC","Saint Lucia"],["VC","Saint Vincent"],["WS","Samoa"],["SM","San Marino"],["ST","Sao Tome and Principe"],["SA","Saudi Arabia"],["SN","Senegal"],["RS","Serbia"],["SC","Seychelles"],["SL","Sierra Leone"],["SG","Singapore"],["SK","Slovakia"],["SI","Slovenia"],["SB","Solomon Islands"],["SO","Somalia"],["ZA","South Africa"],["SS","South Sudan"],["ES","Spain"],["LK","Sri Lanka"],["SD","Sudan"],["SR","Suriname"],["SE","Sweden"],["CH","Switzerland"],["SY","Syria"],["TW","Taiwan"],["TJ","Tajikistan"],["TZ","Tanzania"],["TH","Thailand"],["TL","Timor-Leste"],["TG","Togo"],["TO","Tonga"],["TT","Trinidad and Tobago"],["TN","Tunisia"],["TR","Turkey"],["TM","Turkmenistan"],["TV","Tuvalu"],["UG","Uganda"],["UA","Ukraine"],["AE","United Arab Emirates"],["GB","United Kingdom"],["US","United States"],["UY","Uruguay"],["UZ","Uzbekistan"],["VU","Vanuatu"],["VA","Vatican City"],["VE","Venezuela"],["VN","Vietnam"],["YE","Yemen"],["ZM","Zambia"],["ZW","Zimbabwe"]]

function loadCountries(defaultCountry) {
  const sel = $('.address-country')
  for (const [code, name] of COUNTRIES) {
    const opt = document.createElement('option')
    opt.value = code
    opt.textContent = name
    sel.appendChild(opt)
  }
  if (defaultCountry) sel.value = defaultCountry
}

async function lookupPostal(code, country) {
  if (!code || !country || code.length < 3) return
  setStatus('Looking up postal code…')
  try {
    const res = await fetch(`${API}/${country}/${code}`)
    if (!res.ok) { setStatus('Postal code not found', true); return }
    const json = await res.json()
    _currentData = json.places || []
    if (_currentData.length === 0) { setStatus('No results', true); return }

    const cityInput = $('.address-city')
    const stateInput = $('.address-state')

    if (_currentData.length === 1) {
      cityInput.value = _currentData[0]['place name']
      stateInput.value = _currentData[0]['state']
      setStatus('')
    } else {
      cityInput.setAttribute('list', 'address-cities')
      let dl = root.querySelector('#address-cities')
      if (!dl) {
        dl = document.createElement('datalist')
        dl.id = 'address-cities'
        cityInput.parentNode.appendChild(dl)
      }
      dl.innerHTML = ''
      const seen = new Set()
      for (const p of _currentData) {
        const key = p['place name'] + '|' + p.state
        if (seen.has(key)) continue
        seen.add(key)
        const opt = document.createElement('option')
        opt.value = p['place name']
        dl.appendChild(opt)
      }
      stateInput.value = _currentData[0]['state']
      setStatus(`${_currentData.length} cities found — select one`)
    }
    dispatchAddress()
  } catch(e) {
    setStatus('Lookup failed', true)
  }
}

function dispatchAddress() {
  const addr = getAddress()
  el.dispatchEvent(new CustomEvent('address-change', {
    detail: addr,
    bubbles: true,
    composed: true
  }))
}

function getAddress() {
  return {
    country: $('.address-country').value,
    postal_code: $('.address-postal').value,
    city: $('.address-city').value,
    state: $('.address-state').value,
    street: $('.address-street').value,
    number: $('.address-number').value
  }
}

function init() {
  const defaultCountry = el.getAttribute('country') || ''
  loadCountries(defaultCountry)

  $('.address-postal').addEventListener('input', (e) => {
    clearTimeout(_debounceTimer)
    _debounceTimer = setTimeout(() => {
      lookupPostal(e.target.value, getSelectedCountry())
    }, 350)
  })

  $('.address-country').addEventListener('change', () => {
    const postal = $('.address-postal').value
    if (postal) lookupPostal(postal, getSelectedCountry())
    dispatchAddress()
  })

  root.querySelectorAll('input').forEach(inp => {
    inp.addEventListener('input', () => dispatchAddress())
    inp.addEventListener('change', () => dispatchAddress())
  })

  if (!defaultCountry) {
    fetch('https://ipapi.co/country/')
      .then(r => r.text())
      .then(code => {
        if (code && code.length === 2) {
          const sel = $('.address-country')
          if (sel.querySelector('option[value="' + code + '"]')) {
            sel.value = code
          }
        }
      })
      .catch(() => {})
  }
}

init()
</script>
</template>
