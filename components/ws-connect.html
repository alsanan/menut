<!--
  @component ws-connect
  @category content
  @description WebSocket client with auto-reconnect. Dispatches ws-open, ws-message, ws-close, ws-error events. Messages can be JSON, plain text, or HTML.
  @usage <ws-connect url="wss://echo.rapidtoolset.com/ws" :on.message="handle(event.data)"></ws-connect>
  @impl Creates a WebSocket. Auto-reconnects every 3s on close. Cleans up via this.signal.
-->
<template shadowrootmode="open" url:string="">
<style>:host { display: none; }</style>
<script>
const host = this
const el = host.el
const RECONNECT_MS = 3000
let ws = null
let closed = false

function connect() {
  if (closed) return
  const url = host.url || el.getAttribute('url')
  if (!url) return

  try {
    ws = new WebSocket(url)
  } catch (e) {
    console.error('[ws-connect] failed to create WebSocket for', url, e)
    return
  }

  ws.addEventListener('open', () => {
    el.dispatchEvent(new CustomEvent('ws-open', { bubbles: true, composed: true, detail: { url, socket: ws } }))
  }, { signal: host.signal })

  ws.addEventListener('message', (event) => {
    el.dispatchEvent(new CustomEvent('ws-message', { bubbles: true, composed: true, detail: event }))
  }, { signal: host.signal })

  ws.addEventListener('close', () => {
    el.dispatchEvent(new CustomEvent('ws-close', { bubbles: true, composed: true, detail: { url } }))
    ws = null
    setTimeout(connect, RECONNECT_MS)
  }, { signal: host.signal })

  ws.addEventListener('error', (event) => {
    el.dispatchEvent(new CustomEvent('ws-error', { bubbles: true, composed: true, detail: { event, url } }))
  }, { signal: host.signal })
}

host._cleanup = () => {
  closed = true
  if (ws) { ws.close(); ws = null }
}

connect()
</script>
</template>
