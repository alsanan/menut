<!--
  @component scroll-to-top
  @category layout
  @description Fixed-position FAB that appears after scrolling past an offset and smoothly scrolls back to top.
  @usage <scroll-to-top offset="200"></scroll-to-top>
  @impl The host is `position: fixed` so it floats globally. A tiny scroll listener toggles the `[visible]` attribute; the click uses smooth `window.scrollTo`.
-->
<template shadowrootmode="open" offset:number="200">
<style>
  :host {
    position: fixed;
    bottom: 1.25rem;
    right: 1rem;
    z-index: 999;
    display: block;
    pointer-events: none;
  }
  button {
    width: 2.75rem;
    aspect-ratio: 1;
    border-radius: 50%;
    border: 1px solid var(--hairline, oklch(0.9 0.01 90));
    background: var(--bg-card, oklch(0.97 0.005 90));
    color: var(--fg, oklch(0.15 0.01 90));
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transform: translateY(1rem);
    transition: opacity .2s, transform .2s, border-color .2s, color .2s;
    box-shadow: 0 2px 8px rgb(0 0 0 / .12);
    pointer-events: none;
  }
  button[visible] {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  button::before {
    content: "";
    width: .7rem;
    height: .7rem;
    transform: translateY(15%) rotate(-45deg);
    border-top: 3px solid currentColor;
    border-right: 3px solid currentColor;
  }
  button:hover { border-color: var(--accent, oklch(0.55 0.15 145)); color: var(--accent, oklch(0.55 0.15 145)); transform: translateY(-2px); }
</style>
<button type="button" part="button" aria-label="Scroll to top"></button>

<script>
const host = this
const btn = host.el.shadowRoot.querySelector('button')
const offset = Math.max(0, host.offset || 200)
function update() {
  const y = window.scrollY || document.documentElement.scrollTop || 0
  btn.toggleAttribute('visible', y > offset)
}
window.addEventListener('scroll', update, { passive: true })
btn.addEventListener('click', () => {
  window.scrollTo({ top: 0, behavior: 'smooth' })
})
host.ondisconnected = () => {
  window.removeEventListener('scroll', update)
}
update()
</script>
</template>
