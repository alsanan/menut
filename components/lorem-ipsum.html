<!--
  @component lorem-ipsum
  @category content
  @description Generator of placeholder text (Lorem ipsum). Attribute `size` controls words or paragraphs.
  @usage <lorem-ipsum size="words:50"></lorem-ipsum> · <lorem-ipsum size="paragraphs:3"></lorem-ipsum>
  @impl Pure JS generator. Default unit is words. Renders inside a <p> or multiple <p>.
-->
<template shadowrootmode="open" size:string="words:50">
<style>
  :host { display: block; }
  p { margin: 0 0 0.75rem; line-height: 1.6; }
  p:last-child { margin-bottom: 0; }
</style>
<div id="out"></div>

<script>
const host = this
const out = host.el.shadowRoot.querySelector('#out')
const WORDS = [
  'lorem','ipsum','dolor','sit','amet','consectetur','adipiscing','elit','sed','do',
  'eiusmod','tempor','incididunt','ut','labore','et','dolore','magna','aliqua','ut',
  'enim','ad','minim','veniam','quis','nostrud','exercitation','ullamco','laboris','nisi',
  'ut','aliquip','ex','ea','commodo','consequat','duis','aute','irure','in','reprehenderit',
  'in','voluptate','velit','esse','cillum','dolore','eu','fugiat','nulla','pariatur'
]
function parseSize(s) {
  if (!s) return { unit: 'words', n: 50 }
  const m = String(s).match(/^(?:(words|paragraphs):)?(\d+)$/i)
  if (!m) return { unit: 'words', n: 50 }
  return { unit: m[1] || 'words', n: Math.max(1, parseInt(m[2], 10)) }
}
function randomWord(seed) {
  return WORDS[(seed * 9301 + 49297) % 233280 % WORDS.length]
}
function makeWords(n) {
  let text = ''
  for (let i = 0; i < n; i++) {
    let w = randomWord(i)
    text += (i === 0 ? w.charAt(0).toUpperCase() + w.slice(1) : w) + (i < n - 1 ? ' ' : '.')
    if ((i + 1) % 12 === 0 && i < n - 1) text += ' '
  }
  return text
}
function render() {
  const spec = parseSize(host.el.getAttribute('size') || 'words:50')
  out.innerHTML = ''
  if (spec.unit === 'paragraphs') {
    for (let i = 0; i < spec.n; i++) {
      const p = document.createElement('p')
      p.textContent = makeWords(40 + (i % 20))
      out.appendChild(p)
    }
  } else {
    const p = document.createElement('p')
    p.textContent = makeWords(spec.n)
    out.appendChild(p)
  }
}
render()
host.el._observer = new MutationObserver(() => {
  if (host.el.getAttribute('size') !== undefined) render()
})
host.el._observer.observe(host.el, { attributes: true, attributeFilter: ['size'] })
host._cleanup = () => { host.el._observer.disconnect() }
</script>
</template>
