<!--
  @component stat-counter
  @category data
  @description Animated number counter. Props: number (target), duration (seconds). Animates on scroll into view.
  @usage <stat-counter number="1000" duration="2"></stat-counter>
  @impl IntersectionObserver starts animation. requestAnimationFrame loop interpolates from 0 to target. Typed props + onpropchange re-animate on change (replaces manual MutationObserver).
-->
<template shadowrootmode="open" number:number="0" duration:number="1">
<style>
:host{display:inline-block;font-variant-numeric:tabular-nums}
</style>
<span id="val">0</span>

<script>
const host=this
const root=host.el.shadowRoot
const el=root.getElementById('val')

let started=false
let frame=null

function animate(){
  started=true
  const target=host.number
  const dur=host.duration*1000
  const from=0
  const t0=performance.now()
  cancelAnimationFrame(frame)
  function tick(now){
    const p=Math.min(1,(now-t0)/dur)
    const v=from+(target-from)*p
    const decimals=String(target).includes('.')?String(target).split('.')[1].length:0
    el.textContent=decimals>0?v.toFixed(decimals):Math.round(v)
    if(p<1)frame=requestAnimationFrame(tick)
  }
  frame=requestAnimationFrame(tick)
}

const io=new IntersectionObserver(entries=>{
  if(entries[0].isIntersecting&&!started)animate()
})
io.observe(host.el)

host.onpropchange=(name)=>{
  if((name==='number'||name==='duration')&&started)animate()
}
</script>
</template>
