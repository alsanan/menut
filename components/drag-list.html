<!--
  @component drag-list
  @category forms
  @description Dual-pane list with drag-and-drop and button transfer. Slotted .item elements with slot="source" or slot="target". Arrows move selected or all items. Form-associated.
  @usage <drag-list name="selected"><div class="item" slot="source">Item</div><div class="item" slot="target">Selected</div></drag-list>
  @impl HTML5 drag-and-drop between lists. Click to select, double-click to move, arrow buttons. Updates _internals.setFormValue().
-->
<template shadowrootmode="open">
  <style>
    :host {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: var(--space-3, 16px);
      align-items: start;
    }
    .list {
      min-height: 12rem;
      padding: var(--space-2, 8px);
      border: 1px solid var(--hairline, oklch(0.9 0.01 90));
      border-radius: var(--radius-card, 16px);
      background: var(--bg-card, #fff);
      display: flex;
      flex-direction: column;
      gap: var(--space-1, 4px);
      transition: background-color 0.15s ease;
    }
    .list[dragover] {
      background: var(--bg, oklch(0.97 0.005 90));
      border-color: var(--fg-muted, oklch(0.55 0.02 90));
    }
    .list-title {
      padding: var(--space-1, 4px) var(--space-2, 8px);
      font: 600 var(--fs-sm, 14px)/1.4 inherit;
      color: var(--fg-muted, oklch(0.55 0.02 90));
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .item {
      padding: var(--space-2, 8px) var(--space-3, 16px);
      border: 1px solid var(--hairline, oklch(0.9 0.01 90));
      border-radius: calc(var(--radius-card, 16px) - 4px);
      background: var(--bg, oklch(0.97 0.005 90));
      cursor: grab;
      transition: box-shadow 0.18s ease, transform 0.18s ease, opacity 0.15s ease;
      user-select: none;
    }
    .item:hover {
      box-shadow: 0 2px 8px oklch(0 0 0 / 0.08);
      transform: translateY(-1px);
    }
    .item:active { cursor: grabbing; }
    .item[selected] {
      border-color: var(--fg, oklch(0.15 0.01 90));
      box-shadow: 0 0 0 1px var(--fg, oklch(0.15 0.01 90));
    }
    .item[dragging] { opacity: 0.3; }
    .arrows {
      display: flex;
      flex-direction: column;
      gap: var(--space-1, 4px);
      align-self: center;
    }
    .arrows button {
      appearance: none;
      border: 1px solid var(--hairline, oklch(0.9 0.01 90));
      background: var(--bg-card, #fff);
      width: 2rem;
      height: 2rem;
      border-radius: var(--radius-card, 16px);
      cursor: pointer;
      font-size: 0.9rem;
      line-height: 1;
      color: var(--fg-muted, oklch(0.55 0.02 90));
      transition: background-color 0.18s ease, color 0.18s ease;
    }
    .arrows button:hover {
      background: var(--fg, oklch(0.15 0.01 90));
      color: var(--bg-card, #fff);
    }
  </style>
  <div class="list" data-list="source">
    <div class="list-title">Available</div>
    <slot name="source"></slot>
  </div>
  <div class="arrows">
    <button aria-label="Move selected right" data-dir="right" data-scope="one">&rsaquo;</button>
    <button aria-label="Move all right" data-dir="right" data-scope="all">&raquo;</button>
    <button aria-label="Move all left" data-dir="left" data-scope="all">&laquo;</button>
    <button aria-label="Move selected left" data-dir="left" data-scope="one">&lsaquo;</button>
  </div>
  <div class="list" data-list="target">
    <div class="list-title">Selected</div>
    <slot name="target"></slot>
  </div>

<script>
const host = this
  const root = host.el.shadowRoot
  const srcList = root.querySelector('[data-list="source"]')
  const tgtList = root.querySelector('[data-list="target"]')

  function itemsIn(list) { return list.querySelectorAll('.item') }

  function moveItem(item, toList, animate) {
    const fromRect = animate ? item.getBoundingClientRect() : null
    toList.appendChild(item)
    item.removeAttribute('selected')
    item.removeAttribute('dragging')
    updateFormValue()
    if (fromRect) {
      const toRect = item.getBoundingClientRect()
      const dx = fromRect.left - toRect.left
      const dy = fromRect.top - toRect.top
      if (dx || dy) {
        item.animate([
          { transform: `translate(${dx}px, ${dy}px)`, offset: 0 },
          { transform: 'translate(0, 0)', offset: 1 }
        ], { duration: 250, easing: 'ease-out' })
      }
    }
  }

  function moveItems(fromList, toList, scope, animate) {
    if (scope === 'all') {
      let item
      while (item = fromList.querySelector('.item')) {
        moveItem(item, toList, animate)
      }
    } else {
      const selected = [...fromList.querySelectorAll('.item[selected]')]
      selected.forEach(i => moveItem(i, toList, animate))
    }
  }

  function updateFormValue() {
    const vals = [...itemsIn(tgtList)].map(i => i.textContent.trim())
    const fd = new FormData()
    vals.forEach(v => fd.append(host.el.getAttribute('name') || 'selected', v))
    host.el._internals.setFormValue(fd)
  }

  root.querySelectorAll('.arrows button').forEach(btn => {
    btn.addEventListener('click', () => {
      const dir = btn.getAttribute('data-dir')
      const scope = btn.getAttribute('data-scope')
      const from = dir === 'right' ? srcList : tgtList
      const to = dir === 'right' ? tgtList : srcList
      moveItems(from, to, scope, true)
    })
  })

  function itemFrom(e) {
    return e.composedPath().find(el => el.classList?.contains('item'))
  }

  function listFrom(e) {
    let el = e.target
    while (el && el !== root) {
      if (el.classList?.contains('list')) return el
      el = el.parentElement || el.getRootNode()?.host
    }
    return null
  }

  root.addEventListener('click', e => {
    const item = itemFrom(e)
    if (!item) return
    const list = item.closest('.list')
    if (list && !e.shiftKey && !e.ctrlKey && !e.metaKey) {
      itemsIn(list).forEach(i => i.removeAttribute('selected'))
    }
    item.toggleAttribute('selected')
  })

  root.addEventListener('dblclick', e => {
    const item = itemFrom(e)
    if (!item) return
    const list = item.closest('.list')
    if (!list) return
    const to = list === srcList ? tgtList : srcList
    moveItem(item, to)
  })

  let draggedItem = null

  root.addEventListener('dragstart', e => {
    const item = itemFrom(e)
    if (!item) return
    e.dataTransfer.effectAllowed = 'move'
    e.dataTransfer.setData('text/plain', '')
    draggedItem = item
    requestAnimationFrame(() => item.setAttribute('dragging', ''))
  })

  root.addEventListener('dragend', () => {
    if (draggedItem) {
      draggedItem.removeAttribute('dragging')
      draggedItem = null
    }
    srcList.removeAttribute('dragover')
    tgtList.removeAttribute('dragover')
  })

  root.addEventListener('dragover', e => {
    e.preventDefault()
    e.dataTransfer.dropEffect = 'move'
    const list = listFrom(e)
    srcList.toggleAttribute('dragover', list === srcList)
    tgtList.toggleAttribute('dragover', list === tgtList)
  })

  root.addEventListener('dragleave', e => {
    const list = listFrom(e)
    if (!list) {
      srcList.removeAttribute('dragover')
      tgtList.removeAttribute('dragover')
    }
  })

  root.addEventListener('drop', e => {
    e.preventDefault()
    e.stopPropagation()
    srcList.removeAttribute('dragover')
    tgtList.removeAttribute('dragover')
    if (!draggedItem) return
    const to = listFrom(e)
    if (to) moveItem(draggedItem, to)
  })

  function init() {
    host.el.querySelectorAll('.item').forEach(item => {
      const slot = item.getAttribute('slot') || 'source'
      const target = slot === 'target' ? tgtList : srcList
      if (item.parentElement !== target) {
        item.removeAttribute('slot')
        target.appendChild(item)
      }
      item.setAttribute('draggable', 'true')
    })
  }
  init()
</script>
</template>
