<!--
  @component tag-input
  @category forms
  @description Tag/pill input (Oat-style TagInput). Type and press Enter or comma to add a tag, or pick a datalist suggestion — the value becomes a removable pill. Form-associated; submits a comma-separated list.
  @usage <tag-input name="tags" value="apple, mango"><option value="apple">Apple</option></tag-input>
  @attr value – comma-separated initial tags (reactive; change reloads tags)
  @attr name – form field name for submission (plain attribute)
  @attr children <option> – datalist suggestions (optional; free typing allowed without them)
  @impl Shadow component with internal <input list="dl"> + <datalist id="dl"> built from <option> children. Enter/, adds current text, datalist selection adds on exact match, Backspace on empty removes last pill. setFormValue(comma-joined). Dispatches bubbling input/change with detail = current tag array.
-->
<template shadowrootmode="open" shadowrootdelegatesfocus
         value:string>
  <style>
    :host {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--space-2, 8px);
      padding: var(--space-2, 8px) var(--space-3, 16px);
      border: 1px solid var(--hairline, oklch(0.9 0.01 90));
      border-radius: var(--radius-card, 16px);
      background: var(--bg-card, #fff);
      cursor: text;
      transition: border-color 0.18s ease;
    }
    :host(:focus-within) {
      border-color: var(--fg, oklch(0.15 0.01 90));
    }
    #chips {
      display: contents;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: var(--space-1, 4px);
      background: var(--bg, oklch(0.97 0.005 90));
      border: 1px solid var(--hairline, oklch(0.9 0.01 90));
      border-radius: 999px;
      padding: var(--space-1, 4px) var(--space-2, 8px);
      font-size: var(--fs-sm, 14px);
      line-height: 1;
      animation: tag-in 0.15s ease-out;
    }
    @keyframes tag-in {
      from { opacity: 0; transform: scale(0.9); }
      to   { opacity: 1; transform: scale(1); }
    }
    .chip button {
      border: none;
      background: none;
      padding: 0;
      margin-inline-start: var(--space-1, 4px);
      cursor: pointer;
      color: var(--fg-muted, oklch(0.55 0.02 90));
      font-size: 1em;
      line-height: 1;
      transition: color 0.15s ease;
    }
    .chip button:hover {
      color: var(--fg, oklch(0.15 0.01 90));
    }
    input {
      flex: 1;
      min-width: 8ch;
      border: none;
      background: transparent;
      font: inherit;
      padding: var(--space-1, 4px) 0;
      outline: none;
    }
    input::placeholder {
      color: var(--fg-muted, oklch(0.55 0.02 90));
    }
  </style>
  <div id="chips"></div>
  <input id="field" list="dl" datalist type="text" placeholder="Add…">
  <datalist id="dl"></datalist>

<script>
const host = this
  const root = host.el.shadowRoot
  const chips = root.getElementById('chips')
  const field = root.getElementById('field')
  const dl = root.getElementById('dl')

  const options = []
  host.el.querySelectorAll('option').forEach(o => {
    options.push({ label: o.textContent.trim(), value: (o.getAttribute('value') || o.textContent).trim() })
  })

  let tags = []

  const emit = () => {
    host.el._internals.setFormValue(tags.join(', '))
    const detail = [...tags]
    host.el.dispatchEvent(new CustomEvent('input', { bubbles: true, composed: true, detail }))
    host.el.dispatchEvent(new CustomEvent('change', { bubbles: true, composed: true, detail }))
  }

  function renderChips() {
    chips.replaceChildren()
    tags.forEach((t, i) => {
      const chip = document.createElement('span')
      chip.className = 'chip'
      const txt = document.createElement('span')
      txt.textContent = t
      const rm = document.createElement('button')
      rm.type = 'button'
      rm.setAttribute('aria-label', 'Remove ' + t)
      rm.textContent = '×'
      rm.addEventListener('click', () => removeTag(i))
      chip.append(txt, rm)
      chips.appendChild(chip)
    })
  }

  function addTag(text) {
    text = text.trim().replace(/,$/, '').trim()
    if (!text || tags.includes(text)) return
    tags.push(text)
    renderChips()
    emit()
  }

  function removeTag(i) {
    tags.splice(i, 1)
    renderChips()
    emit()
  }

  function refreshOptions() {
    const q = field.value.trim().toLowerCase()
    dl.replaceChildren()
    options
      .filter(o => !tags.includes(o.value) && o.label.toLowerCase().includes(q))
      .forEach(o => {
        const opt = document.createElement('option')
        opt.value = o.label
        dl.appendChild(opt)
      })
  }

  field.addEventListener('input', () => {
    refreshOptions()
    const exact = options.find(o => o.label.toLowerCase() === field.value.trim().toLowerCase())
    if (exact && !tags.includes(exact.value)) {
      addTag(exact.value)
      field.value = ''
    }
  })

  field.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ',') {
      e.preventDefault()
      addTag(field.value)
      field.value = ''
      refreshOptions()
    } else if (e.key === 'Backspace' && !field.value && tags.length) {
      removeTag(tags.length - 1)
    }
  })

  field.addEventListener('blur', () => {
    addTag(field.value)
    field.value = ''
    refreshOptions()
  })

  host.el.addEventListener('focus', () => field.focus())

  host.onpropchange = name => {
    if (name !== 'value') return
    tags = host.value ? String(host.value).split(',').map(s => s.trim()).filter(Boolean) : []
    renderChips()
    host.el._internals.setFormValue(tags.join(', '))
  }

  if (host.value) {
    tags = String(host.value).split(',').map(s => s.trim()).filter(Boolean)
  }
  renderChips()
  refreshOptions()
  host.el._internals.setFormValue(tags.join(', '))
</script>
</template>
