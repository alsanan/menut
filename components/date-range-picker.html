<!--
  @component date-range-picker
  @category forms
  @description Dual-handle range slider for picking a date range. Leverages the dual-range pattern but maps thumbs to dates.
  @usage <date-range-picker min="2026-08-01" max="2026-08-31" start="2026-08-10" end="2026-08-20"></date-range-picker>
  @impl Converts dates to timestamps and back. Two range inputs overlaid, with labels showing formatted dates.
-->
<template shadowrootmode="open" min:string="" max:string="" start:string="" end:string="" lang:string="en" format:string="d/m/Y">
<style>
  :host { display: block; padding: 2rem 0 1rem; position: relative; }
  .slider { position: relative; height: 28px; }
  .track { position: absolute; left: 0; right: 0; top: 50%; height: 8px; transform: translateY(-50%); border-radius: 999px; background: var(--hairline, oklch(0.9 0.01 90)); overflow: hidden; }
  .fill { position: absolute; top: 0; bottom: 0; border-radius: inherit; background: var(--accent, oklch(0.55 0.15 145)); }
  input[type="range"] { position: absolute; inset: 0; width: 100%; height: 28px; margin: 0; padding: 0; background: none; appearance: none; -webkit-appearance: none; pointer-events: none; outline: none; }
  input[type="range"]::-webkit-slider-runnable-track { height: 28px; background: transparent; }
  input[type="range"]::-moz-range-track { height: 28px; background: transparent; border: none; }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; border: none; border-radius: 50%; background: var(--bg-card, #fff); box-shadow: 0 2px 6px rgb(0 0 0 / .18); cursor: col-resize; pointer-events: auto; position: relative; z-index: 3; }
  input[type="range"]::-moz-range-thumb { width: 24px; height: 24px; border: none; border-radius: 50%; background: var(--bg-card, #fff); box-shadow: 0 2px 6px rgb(0 0 0 / .18); cursor: col-resize; pointer-events: auto; }
  .low { z-index: 2; } .high { z-index: 3; }
  .low::-webkit-slider-thumb, .high::-webkit-slider-thumb { pointer-events: auto; }
  .low::-moz-range-thumb, .high::-moz-range-thumb { pointer-events: auto; }
  .label { position: absolute; top: -1.8rem; transform: translateX(-50%); font-size: .75rem; font-weight: 600; color: var(--fg, oklch(0.15 0.01 90)); white-space: nowrap; user-select: none; pointer-events: none; }
</style>
<div class="slider">
  <div class="track"><div class="fill"></div></div>
  <div class="label label-low"></div>
  <div class="label label-high"></div>
  <input class="low" type="range" aria-label="Start date">
  <input class="high" type="range" aria-label="End date">
</div>

<script>
const host = this
const root = host.el.shadowRoot
const low = root.querySelector('.low')
const high = root.querySelector('.high')
const fill = root.querySelector('.fill')
const labelLow = root.querySelector('.label-low')
const labelHigh = root.querySelector('.label-high')
const DAY = 24 * 60 * 60 * 1000
function parseDate(s) { return s ? new Date(s + 'T00:00:00').getTime() : Date.now() }
const tMin = parseDate(host.min || host.start)
const tMax = parseDate(host.max || host.end)
if (tMin > tMax) { throw new Error('date-range-picker: min/max or start/end invalid') }
function bound(v) { return Math.max(tMin, Math.min(tMax, v)) }
low.min = high.min = tMin
low.max = high.max = tMax
low.step = high.step = DAY
let s = bound(parseDate(host.start || host.min))
let e = bound(parseDate(host.end || host.max))
if (s > e) { const t = s; s = e; e = t }
low.value = s
high.value = e
function fmtLabel(ts) {
  const d = new Date(ts)
  return new Intl.DateTimeFormat(host.lang || 'en', { day: 'numeric', month: 'short' }).format(d)
}
function fmtISO(ts) {
  const d = new Date(ts)
  return d.toISOString().slice(0, 10)
}
function percent(v) { return ((v - tMin) / (tMax - tMin)) * 100 }
function update() {
  let a = Number(low.value)
  let b = Number(high.value)
  if (a > b) {
    if (root.activeElement === low) { high.value = a; b = a }
    else { low.value = b; a = b }
  }
  const pa = percent(a)
  const pb = percent(b)
  fill.style.left = pa + '%'
  fill.style.right = (100 - pb) + '%'
  labelLow.style.left = pa + '%'
  labelHigh.style.left = pb + '%'
  labelLow.textContent = fmtLabel(a)
  labelHigh.textContent = fmtLabel(b)
  host.start = fmtISO(a)
  host.end = fmtISO(b)
  host.el.dispatchEvent(new CustomEvent('change', { detail: { start: host.start, end: host.end } }))
}
low.addEventListener('input', update)
high.addEventListener('input', update)
low.addEventListener('change', update)
high.addEventListener('change', update)
update()
</script>
</template>
