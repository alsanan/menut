<!--
  @component drop-uploader
  @category forms
  @description File drop zone with click-to-browse. Accepts images, shows thumbnail preview. Form-associated (file value).
  @usage <drop-uploader></drop-uploader>
  @impl Drag events + file input. FileReader reads as data URL for preview thumbnail. setFormValue for form submission.
-->
<template shadowrootmode="open">
  <style>
    :host {
      display: block;
    }
    .dropzone {
      border: 2px dashed var(--hairline, oklch(0.9 0.01 90));
      border-radius: var(--radius-card, 16px);
      padding: var(--space-5, 32px);
      min-height: 12rem;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.18s ease, background-color 0.18s ease;
      background: var(--bg-card, #fff);
      color: var(--fg-muted, oklch(0.55 0.02 90));
      font-size: var(--fs-sm, 14px);
    }
    .dropzone:hover {
      border-color: var(--fg-muted, oklch(0.55 0.02 90));
    }
    .dropzone[over] {
      border-style: solid;
      border-color: var(--fg, oklch(0.15 0.01 90));
      background: var(--bg, oklch(0.97 0.005 90));
    }
    .prompt {
      pointer-events: none;
      line-height: 1.6;
    }
    .prompt span {
      display: block;
      font-size: var(--fs-xs, 12px);
      color: var(--fg-muted, oklch(0.55 0.02 90));
      margin-top: var(--space-1, 4px);
    }
    input[type="file"] {
      display: none;
    }
    .thumb {
      width: 100%;
      height: 100%;
      min-height: 12rem;
      border-radius: var(--radius-card, 16px);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      position: relative;
      display: flex;
      align-items: flex-end;
      overflow: hidden;
    }
    .thumb::after {
      content: attr(data-label);
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: var(--space-2, 8px) var(--space-3, 16px);
      background: rgba(0, 0, 0, 0.75);
      color: white;
      font-size: var(--fs-xs, 12px);
      text-align: center;
      box-sizing: border-box;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
  <div class="dropzone">
    <div class="prompt">Drop file here or click to upload<span>Images supported</span></div>
  </div>
  <input type="file" accept="image/*">

<script>
const host = this
  const root = host.el.shadowRoot
  const dropzone = root.querySelector('.dropzone')
  const fileInput = root.querySelector('input[type="file"]')
  const prompt = root.querySelector('.prompt')

  function updateThumbnail(file) {
    if (!file || !file.type.startsWith('image/')) return
    host.el._internals.setFormValue(file)
    const reader = new FileReader()
    reader.onload = (e) => {
      dropzone.innerHTML = ''
      const thumb = document.createElement('div')
      thumb.classList.add('thumb')
      thumb.style.backgroundImage = `url(${e.target.result})`
      thumb.setAttribute('data-label', file.name)
      dropzone.appendChild(thumb)
    }
    reader.readAsDataURL(file)
  }

  dropzone.addEventListener('click', () => fileInput.click())

  fileInput.addEventListener('change', () => {
    if (fileInput.files.length) updateThumbnail(fileInput.files[0])
  })

  dropzone.addEventListener('dragover', (e) => {
    e.preventDefault()
    e.stopPropagation()
    dropzone.setAttribute('over', '')
  })

  dropzone.addEventListener('dragenter', (e) => {
    e.preventDefault()
    e.stopPropagation()
    dropzone.setAttribute('over', '')
  })

  dropzone.addEventListener('dragleave', (e) => {
    e.preventDefault()
    e.stopPropagation()
    if (!dropzone.contains(e.relatedTarget)) {
      dropzone.removeAttribute('over')
    }
  })

  dropzone.addEventListener('dragend', () => {
    dropzone.removeAttribute('over')
  })

  dropzone.addEventListener('drop', (e) => {
    e.preventDefault()
    e.stopPropagation()
    dropzone.removeAttribute('over')
    if (e.dataTransfer.files.length) {
      updateThumbnail(e.dataTransfer.files[0])
    }
  })
</script>
</template>
