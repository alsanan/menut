<!--
  @component x-code-highlight
  @category content
  @description Syntax highlighting using MicroLighter (CSS Custom Highlights API). Wraps an external library as a Menut SFC.
  @usage <x-code-highlight lang="javascript">code here</x-code-highlight>
  @impl Loads MicroLighter from CDN on demand. Uses CSS Custom Highlights API (no DOM spans). Based on https://daverupert.com/2026/08/microlighter/ by Dave Rupert.
  @see https://davatron5000.github.io/microlighter/
-->
<template lang:string="javascript" theme:string="github">
<style>
  :host { display: block; position: relative }
  pre {
    margin: 0;
    padding: 1rem;
    border-radius: var(--radius-card, 12px);
    overflow-x: auto;
    font: 400 0.875em/1.6 'SF Mono', 'Fira Code', monospace;
    tab-size: 2;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: .4rem .75rem;
    font: 500 0.7rem/1 inherit;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .header + pre { border-radius: 0 0 var(--radius-card, 12px) var(--radius-card, 12px) }
  .copy {
    appearance: none; border: 1px solid;
    background: transparent; padding: 2px 8px; border-radius: 6px;
    font: inherit; color: inherit; cursor: pointer;
  }
</style>
<div class="header">
  <span class="lang"></span>
  <button class="copy">Copy</button>
</div>
<pre><code ::="_content"></code></pre>

<script>
const host = this
const el = host.el

let hlAll = null
const THEMES = new Set()

function getLang() {
  return host.lang || el.getAttribute('lang') || 'javascript'
}

function getTheme() {
  return host.theme || el.getAttribute('theme') || 'github'
}

function updateHeader() {
  el.querySelector('.lang').textContent = getLang()
}

function copyCode() {
  const code = el.querySelector('code')
  navigator.clipboard.writeText(code.textContent).then(() => {
    const btn = el.querySelector('.copy')
    btn.textContent = 'Copied!'
    setTimeout(() => btn.textContent = 'Copy', 1500)
  })
}

function loadTheme(name) {
  if (THEMES.has(name)) return
  THEMES.add(name)
  const link = document.createElement('link')
  link.rel = 'stylesheet'
  link.href = 'https://cdn.jsdelivr.net/npm/microlighter@2.1.0/dist/themes/' + name + '.css'
  document.head.appendChild(link)
}

async function loadMicroLighter() {
  if (hlAll) return
  try {
    const mod = await import('https://cdn.jsdelivr.net/npm/microlighter@2.1.0/dist/index.min.js')
    hlAll = mod.highlightAll
  } catch (e) {
    console.warn('x-code-highlight: could not load MicroLighter', e)
  }
}

async function highlight() {
  await loadMicroLighter()
  if (!hlAll) return

  const codeEl = el.querySelector('code')
  if (!codeEl) return

  const lang = getLang()
  const theme = getTheme()

  codeEl.className = 'language-' + lang
  el.setAttribute('data-syntax-theme', theme)
  loadTheme(theme)

  await hlAll({ root: el, selector: 'pre > code' })
}

el.querySelector('.copy').addEventListener('click', copyCode)
host.onpropchange = (name) => {
  if (name === 'lang') { updateHeader(); highlight() }
  if (name === 'theme') highlight()
}
host.onconnected = () => {
  updateHeader()
  highlight()
}
</script>
</template>
